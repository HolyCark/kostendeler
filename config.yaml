name: Kostendeler
version: "1.10.0"
slug: kostendeler
description: Deel boodschappen en huishoudkosten met je huisgenoten en houd samen een takenlijst bij. Alles blijft op je eigen Home Assistant.
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: Kosten
# Ook gebruikers zonder adminrechten (je huisgenoot) zien de app in de zijbalk.
panel_admin: false
# Nodig voor pushmeldingen via de Companion-app.
homeassistant_api: true
hassio_api: true
