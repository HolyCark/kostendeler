<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7e9ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<title>Kostendeler</title>
<style>
  @font-face { font-family: "Outfit"; src: url("fonts/outfit.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    color-scheme: light;
    --bg: #e7e9ec; --text: #1e2227; --muted: #6c727c; --faint: #a3a8b0;
    --line: rgba(30, 34, 39, .07); --glass-border: rgba(255, 255, 255, .85);
    --glass: linear-gradient(160deg, rgba(255, 255, 255, .82), rgba(255, 255, 255, .55));
    --shadow: 0 1px 2px rgba(30, 34, 39, .04), 0 12px 32px rgba(60, 66, 78, .10);
    --pill: linear-gradient(135deg, #4a5059 0%, #2b3036 100%);
    --pill-shadow: 0 10px 24px rgba(30, 34, 39, .28);
    --field: rgba(255, 255, 255, .7); --field-border: rgba(30, 34, 39, .1);
    --tick-on: #2b3036; --tick-off: rgba(30, 34, 39, .14);
    --on-pill: #fff; --surface: rgba(255, 255, 255, .75); --surface-hi: #fff; --icon: #2b3036; --strong: #3b4048;
    --sheet: linear-gradient(175deg, #f7f8f9, #eceef1); --sheet-border: #fff; --overlay: rgba(40, 44, 52, .25);
    --fade: 223, 226, 230; --focus: 43, 48, 54; --toast-bg: rgba(43, 48, 54, .94); --toast-fg: #fff;
    --plus-bg: radial-gradient(circle at 35% 30%, #ffffff, #d9dce2 55%, #b9bec7); --plus-border: rgba(255, 255, 255, .9); --plus-fg: #2b3036;
    --chart-a: #8a9099; --chart-b: #2b3036; --chart-area: rgba(43, 48, 54, .16); --dot-fill: #fff;
    --tab-active-desk: rgba(255, 255, 255, .9); --check-bg: #fff; --check-border: rgba(30, 34, 39, .2);
    --aura-1: rgba(255, 255, 255, .95); --aura-2: rgba(196, 202, 214, .7); --aura-3: rgba(214, 218, 226, .9); --aura-top: #eff0f2; --aura-bottom: #dfe2e6;
    --plus: #1e9a72; --minus: #d0456c;
    --radius: 26px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  html, body { margin: 0; color: var(--text);
    font: 400 16px/1.4 "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body::before { content: ""; position: fixed; inset: -10%; z-index: -1; pointer-events: none;
    background:
      radial-gradient(50% 35% at 5% 0%, var(--aura-1), transparent 70%),
      radial-gradient(45% 35% at 100% 40%, var(--aura-2), transparent 70%),
      radial-gradient(60% 40% at 20% 100%, var(--aura-3), transparent 70%),
      linear-gradient(180deg, var(--aura-top), var(--aura-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 16px calc(118px + env(safe-area-inset-bottom)); }
  .hidden { display: none !important; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* begroeting */
  .hello { display: flex; align-items: center; gap: 14px; margin: 4px 2px 18px; }
  .hello .txt { flex: 1; min-width: 0; }
  .hello .date { font-size: 13px; color: var(--muted); }
  .hello h1 { margin: 2px 0 0; font-size: 25px; font-weight: 300; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 500;
    background: var(--glass); border: 1px solid var(--glass-border); box-shadow: var(--shadow); }

  /* glazen kaarten */
  .card, .list, .tile { background: var(--glass); border: 1px solid var(--glass-border); border-radius: var(--radius);
    backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: var(--shadow); }
  .card { padding: 18px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; gap: 9px; font-size: 16px; margin-bottom: 14px; }
  .card-head svg, .tile-head svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
  .card-head .sp { flex: 1; }
  .status { font-size: 12px; padding: 5px 11px; border-radius: 999px; background: rgba(30, 34, 39, .05); border: 1px solid var(--line); white-space: nowrap; }
  .status i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
  .k { font-size: 12px; color: var(--muted); }
  .v { font-size: 14px; margin-bottom: 10px; }
  .big { font-size: 40px; font-weight: 250; letter-spacing: -1px; line-height: 1.05; margin: 2px 0 14px; }
  .big .cur { font-size: .55em; font-weight: 300; margin-right: 4px; color: var(--muted); letter-spacing: 0; }
  .pos { color: var(--plus); } .neg { color: var(--minus); }

  .hero-grid { display: grid; grid-template-columns: 1fr 132px; gap: 8px; align-items: center; }
  .gauge { position: relative; width: 132px; height: 132px; }
  .gauge svg { width: 100%; height: 100%; }
  .gauge .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .gauge .n { font-size: 30px; font-weight: 250; line-height: 1; }
  .gauge .s { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .wide { width: 100%; margin-top: 10px; border-radius: 999px; padding: 13px 16px; font-size: 14px; display: flex; justify-content: center; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--field-border); box-shadow: 0 2px 8px rgba(30, 34, 39, .05); }
  .wide b { font-weight: 500; }
  .wide .arr { opacity: .6; }

  /* tegels */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
  .tile { padding: 15px; min-height: 168px; display: flex; flex-direction: column; }
  .tile-head { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 12px; }
  .tile .grow { flex: 1; display: flex; align-items: flex-end; }
  .tile .num { font-size: 26px; font-weight: 250; letter-spacing: -.5px; margin-top: 10px; }
  .tile .num .cur { font-size: .6em; color: var(--muted); margin-right: 3px; }
  .tile .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .minibars { display: flex; align-items: flex-end; gap: 7px; height: 52px; width: 100%; }
  .minibars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .minibars span { width: 7px; border-radius: 4px; background: rgba(30, 34, 39, .14); min-height: 4px; }
  .minibars div.cur span { background: var(--tick-on); }
  .minibars small { font-size: 9px; color: var(--faint); text-transform: uppercase; }
  .segbar { display: flex; gap: 3px; height: 10px; width: 100%; border-radius: 6px; overflow: hidden; }
  .segbar i { display: block; height: 100%; border-radius: 3px; }
  .legend { margin-top: 10px; display: grid; gap: 4px; width: 100%; }
  .legend div { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend i { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }

  .btn { border: 1px solid var(--field-border); border-radius: 999px; padding: 10px 18px; font-weight: 500; background: var(--surface); }
  .btn.primary { border: 0; background: var(--pill); color: var(--on-pill); box-shadow: var(--pill-shadow), inset 0 1px 0 rgba(255, 255, 255, .15); }
  .btn.danger { background: transparent; border-color: rgba(208, 69, 108, .35); color: var(--minus); }
  .btn.block { width: 100%; padding: 15px; font-size: 16px; }
  .btn:disabled { opacity: .35; cursor: default; box-shadow: none; }

  /* maandnavigatie */
  .monthnav { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 6px; }
  .monthnav h2 { margin: 0; font-size: 17px; font-weight: 400; }
  .monthnav h2::first-letter { text-transform: uppercase; }
  .iconbtn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--glass-border); background: var(--glass); font-size: 18px; box-shadow: var(--shadow); }
  .iconbtn:disabled { opacity: .35; box-shadow: none; }

  /* lijst */
  .day { color: var(--muted); font-size: 13px; margin: 16px 6px 8px; }
  .list { overflow: hidden; }
  .item { display: flex; gap: 12px; align-items: center; padding: 13px 15px; border-top: 1px solid var(--line); width: 100%; text-align: left;
    background: none; border-left: 0; border-right: 0; border-bottom: 0; }
  .item:first-child { border-top: 0; }
  .item:active { background: rgba(30, 34, 39, .03); }
  .ico { width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center; border-radius: 50%; color: var(--icon); }
  .ci { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .chip .ci { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  .check .ci { width: 15px; height: 15px; stroke-width: 2.2; }
  .cat-name { display: inline-flex; align-items: center; gap: 10px; }
  .cat-name .ci { width: 18px; height: 18px; color: var(--muted); }
  .icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .icon-pick { aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--field-border); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--strong); }
  .icon-pick.on { background: var(--pill); color: var(--on-pill); border-color: transparent; box-shadow: 0 6px 16px rgba(30, 34, 39, .22); }
  @media (max-width: 380px) { .icon-grid { grid-template-columns: repeat(6, 1fr); } }
  .item .main { flex: 1; min-width: 0; }
  .item .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { color: var(--muted); font-size: 13px; }
  .item .right { text-align: right; white-space: nowrap; }
  .item .amt { font-weight: 400; font-size: 16px; }
  .item .effect { font-size: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 34px 16px; }

  /* navigatie */
  .navfade { position: fixed; left: 0; right: 0; bottom: 0; height: 130px; pointer-events: none; z-index: 4;
    background: linear-gradient(to top, rgba(var(--fade), .95) 25%, rgba(var(--fade), 0)); }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 5;
    display: flex; justify-content: center; align-items: center; gap: 10px; padding: 0 16px; }
  nav.tabs .tab, nav.tabs .plus { height: 56px; border-radius: 999px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--strong);
    box-shadow: var(--shadow); transition: all .25s; }
  nav.tabs .tab { width: auto; padding: 0 17px; gap: 0; }
  nav.tabs .tab span { display: inline-block; max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap; font-size: 15px;
    transition: max-width .3s cubic-bezier(.2,.8,.2,1), opacity .2s, margin .3s; }
  nav.tabs .tab.active { padding: 0 22px 0 18px; gap: 8px; background: var(--pill); border-color: transparent; color: var(--on-pill);
    box-shadow: var(--pill-shadow), inset 0 1px 0 rgba(255, 255, 255, .18); }
  nav.tabs .tab.active span { max-width: 130px; opacity: 1; }
  nav.tabs svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs .plus { width: 60px; height: 60px; padding: 0; border: 4px solid var(--plus-border);
    background: var(--plus-bg); color: var(--plus-fg);
    box-shadow: 0 10px 26px rgba(60, 66, 78, .28); }
  nav.tabs .plus svg { width: 24px; height: 24px; stroke-width: 2.2; }
  /* Vier tabbladen + plusknop: op smalle telefoons iets compacter, op de smalste alleen iconen. */
  @media (max-width: 440px) {
    nav.tabs { gap: 6px; padding: 0 8px; }
    nav.tabs .tab, nav.tabs .plus { height: 52px; }
    nav.tabs .tab { padding: 0 12px; }
    nav.tabs .tab.active { padding: 0 14px 0 12px; gap: 6px; }
    nav.tabs .tab span { font-size: 14px; }
    nav.tabs .plus { width: 54px; height: 54px; }
  }
  @media (max-width: 374px) {
    nav.tabs .tab.active { padding: 0 12px; gap: 0; }
    nav.tabs .tab.active span { max-width: 0; opacity: 0; }
  }

  /* taken */
  .quickadd { display: flex; gap: 10px; margin-bottom: 4px; }
  .quickadd .input { flex: 1; min-width: 0; border-radius: 999px; padding: 14px 20px; background: var(--surface); }
  .quickadd .btn { width: 50px; height: 50px; flex: 0 0 50px; padding: 0; display: grid; place-items: center; }
  .quickadd .btn .ci { width: 20px; height: 20px; stroke-width: 2.2; }
  .day.late { color: var(--minus); }
  .task { display: flex; align-items: center; gap: 2px; padding: 0 15px 0 4px; border-top: 1px solid var(--line); transition: opacity .3s, background-color .2s; }
  .task:first-child { border-top: 0; }
  .tcheck { width: 46px; height: 56px; flex: 0 0 46px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
  .tcheck .check { transition: background-color .2s, border-color .2s, color .2s, box-shadow .2s; }
  .tmain { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 12px 0; display: block; }
  .tmain:active:not(:disabled) { transform: scale(.99); }
  .task .title { display: block; font-weight: 500; line-height: 1.3; overflow-wrap: anywhere; transition: color .2s; }
  .task .meta { display: flex; flex-wrap: wrap; gap: 0 12px; margin-top: 2px; color: var(--muted); font-size: 13px; }
  .task .meta span { display: inline-flex; align-items: center; }
  .task .meta .ci { width: 13px; height: 13px; margin-right: 4px; stroke-width: 1.8; }
  .task .meta .late { color: var(--minus); }
  .tav { width: 30px; height: 30px; flex: 0 0 30px; margin-left: 8px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--field-border); color: var(--strong); }
  .task.is-done .title { text-decoration: line-through; color: var(--muted); font-weight: 400; }
  .task.finishing { opacity: .55; }
  .task.finishing .title { text-decoration: line-through; color: var(--muted); }
  .task.finishing .check { background: var(--pill); border-color: transparent; color: var(--on-pill); box-shadow: 0 4px 12px rgba(30, 34, 39, .25); }
  .task.fresh { animation: flash 1.4s ease-out .2s both; }
  .donetoggle { display: block; margin: 16px auto 0; }
  #taskdone .list { margin-top: 12px; }

  /* sheets */
  .overlay { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--sheet); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    border-radius: 30px 30px 0 0; border: 1px solid var(--sheet-border); border-bottom: 0;
    padding: 10px 20px calc(22px + env(safe-area-inset-bottom)); animation: up .38s cubic-bezier(.2, 1.15, .35, 1); box-shadow: 0 -20px 50px rgba(40, 44, 52, .18); }
  @keyframes up { from { transform: translateY(70%); } to { transform: none; } }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: rgba(30, 34, 39, .15); margin: 0 auto 14px; }
  .sheet h3 { margin: 0 0 16px; font-size: 21px; font-weight: 300; }
  .field { margin-bottom: 18px; }
  .field > label, .label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .input { width: 100%; border: 1px solid var(--field-border); background: var(--field); border-radius: 16px; padding: 13px 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
  .input:focus { border-color: rgba(var(--focus), .45); box-shadow: 0 0 0 4px rgba(var(--focus), .08); }
  .amount-input { display: flex; align-items: baseline; gap: 6px; padding: 4px 0 8px; border-bottom: 1px solid var(--field-border); }
  .amount-input:focus-within { border-color: rgba(var(--focus), .5); }
  .amount-input span { font-size: 26px; font-weight: 300; color: var(--muted); }
  .amount-input input { border: 0; background: none; font-size: 46px; font-weight: 250; letter-spacing: -1px; width: 100%; outline: none; padding: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--field-border); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; transition: all .15s; }
  .chip.on { background: var(--pill); border-color: transparent; color: var(--on-pill); box-shadow: 0 6px 16px rgba(30, 34, 39, .22); }
  .split-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
  .split-row .who { flex: 1; }
  .split-row input { width: 116px; text-align: right; }
  .split-row select.hoursel { width: auto; flex: 0 0 auto; padding: 9px 36px 9px 14px; border-radius: 999px; font-size: 14px; }
  .check { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--check-border); display: grid; place-items: center; font-size: 13px; color: transparent; background: var(--check-bg); padding: 0; }
  .check.on { background: var(--pill); border-color: transparent; color: var(--on-pill); box-shadow: 0 4px 12px rgba(30, 34, 39, .25); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .hint.warn { color: var(--minus); }
  .toggle-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .toggle-line .label, .toggle-line h4 { margin: 0; }
  .linkbtn { border: 0; background: none; color: var(--strong); font-weight: 500; font-size: 14px; padding: 4px 0; text-decoration: underline; text-decoration-color: rgba(30, 34, 39, .25); text-underline-offset: 3px; }
  .row-actions { display: flex; gap: 10px; margin-top: 10px; }
  .row-actions .btn { flex: 1; }

  /* per maand */
  .person-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .person-row:first-of-type { border-top: 0; }
  .person-row .r { color: var(--muted); }
  .person-row .r b { color: var(--text); font-weight: 400; }
  .cat-row { padding: 9px 0; }
  .cat-row .top { display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
  .cat-row .top b { font-weight: 400; }
  .bar { height: 8px; background: rgba(30, 34, 39, .07); border-radius: 5px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; }
  .cat-row .sub { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
  .chart .labels { display: flex; justify-content: space-between; margin-top: 8px; }
  .chart .labels button { border: 0; background: none; padding: 4px 2px; font-size: 12px; color: var(--faint); flex: 1; }
  .chart .labels button.cur { color: var(--text); font-weight: 500; }
  .settings-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .settings-item:first-of-type, .card-head + .settings-item { border-top: 0; }
  .settings-item .grow { flex: 1; min-width: 0; }
  .settings-item .two { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
  .settings-item .side { font-size: 12px; white-space: nowrap; }
  .title .rep { width: 14px; height: 14px; vertical-align: -1px; margin-left: 6px; color: var(--muted); stroke-width: 1.8; }
  .item .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  select.input { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, #6c727c 50%), linear-gradient(135deg, #6c727c 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 15px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 40px; }
  .muted { color: var(--muted); }
  h4 { margin: 0 0 10px; font-size: 16px; font-weight: 400; }

  .toast.has-action { top: auto; bottom: calc(96px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 20px;
    width: max-content; max-width: calc(100% - 32px); }
  .toast.has-action span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .toast-btn { white-space: nowrap; flex: 0 0 auto; border: 0; border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; background: rgba(255, 255, 255, .16); color: inherit; }
  @media (prefers-color-scheme: dark) { .toast-btn { background: rgba(0, 0, 0, .1); } }
  @media (min-width: 900px) { .toast.has-action { bottom: 32px; left: calc(50% + 130px); } }
  .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30; max-width: 90%; text-align: center;
    background: var(--toast-bg); color: var(--toast-fg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 11px 20px; border-radius: 999px; font-size: 14px; box-shadow: 0 10px 30px rgba(30, 34, 39, .25); animation: drop .32s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes drop { from { transform: translate(-50%, -24px) scale(.96); opacity: 0; } }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); }

  /* ---------- effecten: subtiel en snel ---------- */

<script>
"use strict";
// ------------------------------------------------------------ basis
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const euro = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const plain = new Intl.NumberFormat("nl-NL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = c => euro.format((c || 0) / 100);
const big = (c, k) => `<span class="cur">€</span><span${k ? ` data-count="${k}" data-v="${Math.abs(c || 0)}"` : ""}>${plain.format(Math.abs(c || 0) / 100)}</span>`;
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch {} };
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
// Bedragen tellen soepel naar hun nieuwe waarde.
function animateCounts(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const k = el.dataset.count, to = Number(el.dataset.v), isPct = k.startsWith("pct");
    const from = S.counts[k] ?? (S.firstPaint ? 0 : to);
    S.counts[k] = to;
    const show = v => el.textContent = isPct ? Math.round(v) : plain.format(v / 100);
    if (from === to || reduceMotion()) return show(to);
    const t0 = performance.now(), dur = 650;
    show(from);
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
      show(from + (to - from) * e);
      if (t < 1 && el.isConnected) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const thisMonth = () => todayISO().slice(0, 7);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
// Zachte kleuren per categorie (zoals de activiteitsringen).
const PALETTE = ["#ee8fb5", "#4fcf9f", "#7fa3ee", "#a99bea", "#f3a65e", "#4cc3d6", "#e9c44f", "#9aa6b8"];
const catColor = id => id == null ? "#94a3b8" : PALETTE[(Number(id) - 1) % PALETTE.length];
const tint = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const CAT_ICONS = {"cart": "<circle cx=\"9\" cy=\"20\" r=\"1.3\"/><circle cx=\"17\" cy=\"20\" r=\"1.3\"/><path d=\"M3 4h2.2l2.3 11h10.3l2-8H6.4\"/>","sparkle": "<path d=\"M11 4l1.6 4.4L17 10l-4.4 1.6L11 16l-1.6-4.4L5 10l4.4-1.6z\"/><path d=\"M18 14.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z\"/>","bottle": "<path d=\"M10 3h4v3l1.5 2.5V19a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2V8.5L10 6z\"/><path d=\"M8.5 12.5h7\"/>","sofa": "<path d=\"M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3\"/><path d=\"M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v4H3z\"/><path d=\"M5 17v2M19 17v2\"/>","utensils": "<path d=\"M5 3v5a2 2 0 0 0 4 0V3M7 3v18\"/><path d=\"M17 21V3c-2 1-3 3.5-3 7h3\"/>","box": "<path d=\"M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z\"/><path d=\"M3.5 7.5 12 12l8.5-4.5M12 12v9\"/>","home": "<path d=\"M4 11 12 4l8 7\"/><path d=\"M6 9.5V20h12V9.5\"/>","bolt": "<path d=\"M13 3 5 14h6l-1 7 8-11h-6z\"/>","wifi": "<path d=\"M3 9a13 13 0 0 1 18 0M6 12.5a8.5 8.5 0 0 1 12 0M9 16a4 4 0 0 1 6 0\"/><circle cx=\"12\" cy=\"19.2\" r=\".9\"/>","gift": "<rect x=\"4\" y=\"9\" width=\"16\" height=\"11\" rx=\"1.5\"/><path d=\"M3 9h18M12 9v11\"/><path d=\"M12 9C10.5 6 7 5.5 7 7.8 7 9 12 9 12 9zm0 0c1.5-3 5-3.5 5-1.2C17 9 12 9 12 9z\"/>","cup": "<path d=\"M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z\"/><path d=\"M16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3v2M11 3v2\"/>","plant": "<path d=\"M12 21v-9\"/><path d=\"M12 12c0-4 3-6 7-6 0 4-3 6-7 6zM12 14.5c0-3-2.5-5-6-5 0 3 2.5 5 6 5z\"/>","wrench": "<path d=\"M15 4a4 4 0 0 0-3.7 5.5L4 16.8V20h3.2l7.3-7.3A4 4 0 0 0 20 9l-2.5 2.5-2.5-.5-.5-2.5z\"/>","paw": "<circle cx=\"8\" cy=\"8.5\" r=\"1.6\"/><circle cx=\"16\" cy=\"8.5\" r=\"1.6\"/><circle cx=\"4.8\" cy=\"12.8\" r=\"1.4\"/><circle cx=\"19.2\" cy=\"12.8\" r=\"1.4\"/><path d=\"M12 12c-2.5 0-5 3.5-5 5.5S9 20 12 20s5-.5 5-2.5-2.5-5.5-5-5.5z\"/>","shirt": "<path d=\"M8 3 3.5 6l2 4L8 9v12h8V9l2.5 1 2-4L16 3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z\"/>","tag": "<path d=\"M3 12V4h8l9 9-8 8z\"/><circle cx=\"7.5\" cy=\"8.5\" r=\"1.3\"/>"};
const catIcon = key => `<svg class="ci" viewBox="0 0 24 24" aria-hidden="true">${CAT_ICONS[key] || CAT_ICONS.box}</svg>`;
const SWAP_ICON = '<svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>';
const REPEAT_ICON = '<svg class="ci rep" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11V9a3 3 0 0 1 3-3h12l-3-3M20 13v2a3 3 0 0 1-3 3H5l3 3"/></svg>';
const CHECK_ICON = '<svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg>';
const ICON = {
  wallet: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>',
  bars: '<svg viewBox="0 0 24 24"><path d="M5 19V11M10 19V6M15 19v-6M20 19V9"/></svg>',
  user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 4-5 7-5s5.8 1.4 7 5"/></svg>',
  tag: '<svg viewBox="0 0 24 24"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>',
  people: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.9-3 3-4.5 5.5-4.5s4.6 1.5 5.5 4.5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.6c2.3-.3 4.2.9 5 3.6"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  bell: '<svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>',
  chart: '<svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>',
};

const S = {
  me: null, ingress: true, users: [], categories: [],
  tab: "home", month: thisMonth(), counts: {}, firstPaint: true, animate: true, fresh: null, recurring: [], statsMode: "month", year: new Date().getFullYear(), ysummary: null, notify: undefined,
  balances: {}, suggestions: [], activity: { expenses: [], settlements: [] }, summary: null,
  tasks: { open: [], done: [] }, taskFilter: store.get("kostendeler-taskfilter") === "mine" ? "mine" : "all", showDone: false,
};

async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  const local = store.get("kostendeler-user");
  if (local) headers["X-Kostendeler-User"] = local;
  const res = await fetch(BASE + "api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Fout " + res.status);
  return data;
}

function toast(msg, action) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast ${action ? "has-action" : ""}"><span>${esc(msg)}</span>${action ? `<button class="toast-btn">${esc(action.label)}</button>` : ""}</div>`;
  clearTimeout(toast.t);
  if (action) root.querySelector(".toast-btn").addEventListener("click", () => {
    clearTimeout(toast.t); root.innerHTML = ""; action.fn();
  });
  toast.t = setTimeout(() => (root.innerHTML = ""), action ? 6000 : 2600);
}
// Verwijderen zonder pop-up: wel 6 seconden "Ongedaan maken".
function undoToast(msg, restorePath, record, freshPrefix) {
  toast(msg, { label: "Ongedaan maken", fn: async () => {
    try { const r = await api("POST", restorePath, record); S.fresh = freshPrefix + r.id; buzz(); await refresh(); toast("Teruggezet"); }
    catch (err) { toast(err.message); }
  } });
}

function parseAmount(str) {
  let s = String(str || "").replace(/[€\s]/g, "");
  if (!s) return null;
  if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "");
  s = s.replace(",", ".");
  if (!/^\d*\.?\d{0,2}$/.test(s)) return NaN;
  const n = Math.round(parseFloat(s) * 100);
  return isNaN(n) ? NaN : n;
}
const centsToInput = c => (c / 100).toFixed(2).replace(".", ",");

const user = id => S.users.find(u => u.id === id);
const nameOf = (id, c) => id === S.me ? (c ? "Jij" : "jij") : (user(id)?.name || "Onbekend");
const nameObj = id => id === S.me ? "jou" : (user(id)?.name || "Onbekend");
const cat = id => S.categories.find(c => c.id === id);
const monthLabel = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo - 1, 1).toLocaleDateString("nl-NL", { month: "long", year: "numeric" }); };
const monthShort = m => new Date(m + "-01T00:00").toLocaleDateString("nl-NL", { month: "short" }).replace(".", "");
const shiftMonth = (m, d) => { const [y, mo] = m.split("-").map(Number); const x = new Date(y, mo - 1 + d, 1); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`; };
function dayLabel(iso) {
  const t = todayISO();
  const y = new Date(Date.now() - 864e5); y.setMinutes(y.getMinutes() - y.getTimezoneOffset());
  if (iso === t) return "Vandaag";
  if (iso === y.toISOString().slice(0, 10)) return "Gisteren";
  return cap(new Date(iso + "T00:00").toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" }));
}
function greeting() {
  const h = new Date().getHours();
  return h < 6 ? "Goedenacht" : h < 12 ? "Goedemorgen" : h < 18 ? "Goedemiddag" : "Goedenavond";
}
const initials = n => (n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");

// ------------------------------------------------------------ laden
async function boot() {
  try {
    const me = await api("GET", "/me");
    Object.assign(S, { me: me.me, ingress: me.ingress, users: meFirst(me.users, me.me), categories: me.categories });
    if (!S.me) return showWhoAmI();
    document.getElementById("tabs").classList.remove("hidden");
    document.getElementById("navfade").classList.remove("hidden");
    await refresh();
  } catch (e) {
    document.getElementById("app").innerHTML = `<div class="empty">Kon de app niet laden.<br>${esc(e.message)}</div>`;
  }
}

async function refresh() {
  const [b, a, s, r, t] = await Promise.all([
    api("GET", "/balances"), api("GET", "/activity?month=" + S.month), api("GET", "/summary?month=" + S.month), api("GET", "/recurring"), api("GET", "/tasks")]);
  S.balances = b.balances; S.suggestions = b.suggestions; S.activity = a; S.summary = s; S.recurring = r.recurring; S.tasks = t;
  if (S.tab === "stats" && S.statsMode === "year") S.ysummary = await api("GET", "/summary?year=" + S.year);
  render();
}

const meFirst = (users, id) => [...users].sort((a, b) => (b.id === id) - (a.id === id));

async function reloadMeta() {
  const me = await api("GET", "/me");
  S.users = meFirst(me.users, S.me); S.categories = me.categories;
}

// ------------------------------------------------------------ renderen
function syncTabs() {
  document.querySelectorAll("nav.tabs .tab").forEach(b => b.classList.toggle("active", b.dataset.tab === S.tab));
  // De plusknop voegt toe wat bij het tabblad past.
  const fab = document.getElementById("fab"), label = S.tab === "tasks" ? "Nieuwe taak" : "Nieuwe uitgave";
  fab.setAttribute("aria-label", label); fab.querySelector("span").textContent = label;
}
function render() {
  syncTabs();
  const app = document.getElementById("app");
  // Taken: alleen de lijst verversen, zodat het invoerveld zijn focus (en het toetsenbord) houdt.
  if (S.tab === "tasks" && app.dataset.view === "tasks" && !S.animate && document.getElementById("tasklist")) {
    document.getElementById("tasklist").innerHTML = renderTaskList();
    document.getElementById("taskdone").innerHTML = renderTaskDone();
    document.getElementById("taskseg").innerHTML = taskSegInner();
    S.fresh = null;
    return;
  }
  if (S.tab === "home") app.innerHTML = renderHome();
  else if (S.tab === "tasks") app.innerHTML = renderTasks();
  else if (S.tab === "stats") app.innerHTML = renderStats();
  else app.innerHTML = renderSettings();
  app.dataset.view = S.tab;
  app.classList.remove("enter");
  if (S.animate) {
    void app.offsetWidth; // herstart animaties
    [...app.children].flatMap(el => el.classList.contains("cols") ? [...el.querySelectorAll(":scope > .col > *")] : [el])
      .forEach((el, i) => { el.classList.add("a"); el.style.setProperty("--i", Math.min(i, 8)); });
    app.classList.add("enter");
    S.animate = false;
  }
  animateCounts(app);
  S.firstPaint = false;
  S.fresh = null;
}

function monthNav() {
  const isNow = S.month >= thisMonth();
  return `<div class="monthnav">
    <button class="iconbtn" data-act="prev-month" aria-label="Vorige maand">‹</button>
    <h2>${esc(monthLabel(S.month))}</h2>
    <button class="iconbtn" data-act="next-month" aria-label="Volgende maand" ${isNow ? "disabled" : ""}>›</button>
  </div>`;
}

function gauge(pct) {
  const N = 56, lit = pct == null ? 0 : Math.round(pct * N);
  let ticks = "";
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 - Math.PI / 2;
    const r1 = 52, r2 = i % 7 === 0 ? 62 : 60;
    const on = i < lit;
    ticks += `<line class="tk ${on ? "on" : ""}" style="animation-delay:${(i * 9 + 120)}ms" x1="${(66 + r1 * Math.cos(a)).toFixed(1)}" y1="${(66 + r1 * Math.sin(a)).toFixed(1)}" x2="${(66 + r2 * Math.cos(a)).toFixed(1)}" y2="${(66 + r2 * Math.sin(a)).toFixed(1)}"
      stroke="var(${on ? "--tick-on" : "--tick-off"})" stroke-width="${on ? 2.2 : 1.6}" stroke-linecap="round"/>`;
  }
  return `<div class="gauge"><svg viewBox="0 0 132 132">${ticks}</svg>
    <div class="c"><div class="n tnum">${pct == null ? "–" : `<span data-count="pct" data-v="${Math.round(pct * 100)}">${Math.round(pct * 100)}</span>`}</div><div class="s">% door jou<br>betaald</div></div></div>`;
}

function renderHero() {
  const mine = S.balances[S.me] || 0;
  const allZero = Object.values(S.balances).every(v => v === 0);
  const s = S.summary && S.summary.month === S.month ? S.summary : null;
  const total = s?.total || 0, paid = s?.per_user[S.me]?.paid || 0;
  const status = allZero ? `<span class="status pos"><i></i>In balans</span>`
    : mine > 0 ? `<span class="status pos"><i></i>Tegoed</span>` : mine < 0 ? `<span class="status neg"><i></i>Te betalen</span>` : `<span class="status"><i></i>Op nul</span>`;
  const label = allZero ? "Jullie staan quitte" : mine > 0 ? "Je krijgt nog" : mine < 0 ? "Je moet nog betalen" : "Jij staat op nul";
  const buttons = S.suggestions.map((sg, i) => {
    const txt = sg.to === S.me ? `<b>${esc(nameOf(sg.from, true))}</b> betaalt jou terug`
      : sg.from === S.me ? `Afrekenen met <b>${esc(nameOf(sg.to))}</b>`
      : `${esc(nameOf(sg.from, true))} → ${esc(nameObj(sg.to))} · ${fmt(sg.amount)}`;
    return `<button class="wide" data-act="settle" data-i="${i}"><span>${txt}</span><span class="arr">↗</span></button>`;
  }).join("");
  return `<div class="card">
    <div class="card-head">${ICON.wallet}<span class="sp">Saldo</span>${status}</div>
    <div class="hero-grid">
      <div>
        <div class="k">${label}</div>
        <div class="big tnum ${mine > 0 ? "pos" : mine < 0 ? "neg" : ""}">${big(mine, "hero")}</div>
        <div class="k">${esc(cap(monthLabel(S.month).split(" ")[0]))} uitgegeven</div>
        <div class="v tnum">${fmt(total)}</div>
        <div class="k">Door jou betaald</div>
        <div class="v tnum" style="margin:0">${fmt(paid)}</div>
      </div>
      ${gauge(total ? paid / total : null)}
    </div>${buttons}</div>`;
}

function renderTiles() {
  const s = S.summary && S.summary.month === S.month ? S.summary : null;
  if (!s) return "";
  const hist = s.history.slice(-6);
  const max = Math.max(1, ...hist.map(h => h.total));
  const count = s.per_category.reduce((a, c) => a + c.count, 0);
  const myShare = s.per_user[S.me]?.share || 0;
  const mineByCat = s.per_category.map(c => ({ id: c.category_id, v: c.shares[S.me] || 0 })).filter(c => c.v > 0).sort((a, b) => b.v - a.v);
  const bars = hist.length ? hist.map(h => `<div class="${h.month === S.month ? "cur" : ""}"><span style="height:${Math.max(8, Math.round(h.total / max * 100))}%"></span><small>${esc(monthShort(h.month).slice(0, 1))}</small></div>`).join("")
    : `<div class="cur"><span style="height:8%"></span><small>${esc(monthShort(S.month).slice(0, 1))}</small></div>`;
  const seg = mineByCat.length ? mineByCat.map(c => `<i style="flex:${c.v};background:${catColor(c.id)}"></i>`).join("") : `<i style="flex:1;background:var(--line)"></i>`;
  const legend = mineByCat.slice(0, 2).map(c => `<div><i style="background:${catColor(c.id)}"></i>${esc(cat(c.id)?.name || "Overig")}</div>`).join("");
  return `<div class="tiles">
    <div class="tile"><div class="tile-head">${ICON.bars}Deze maand</div>
      <div class="grow"><div class="minibars">${bars}</div></div>
      <div class="num tnum">${big(s.total, "month")}</div><div class="sub">${count} ${count === 1 ? "uitgave" : "uitgaven"}</div></div>
    <div class="tile"><div class="tile-head">${ICON.user}Jouw deel</div>
      <div class="grow" style="flex-direction:column;align-items:stretch;justify-content:flex-end"><div class="segbar">${seg}</div><div class="legend">${legend}</div></div>
      <div class="num tnum">${big(myShare, "share")}</div><div class="sub">van ${fmt(s.total)} totaal</div></div>
  </div>`;
}

function expenseEffect(e) {
  const myShare = e.shares[S.me] || 0;
  if (e.paid_by === S.me) {
    const lent = e.amount - myShare;
    return lent > 0 ? `<div class="effect pos">je krijgt ${fmt(lent)}</div>` : `<div class="effect muted">alleen voor jou</div>`;
  }
  return myShare > 0 ? `<div class="effect neg">jouw deel ${fmt(myShare)}</div>` : `<div class="effect muted">niet voor jou</div>`;
}

function renderHome() {
  const meName = (user(S.me)?.name || "").split(" ")[0];
  const header = `<header class="hello"><div class="txt">
      <div class="date">${esc(cap(new Date().toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long" })))}</div>
      <h1>${greeting()}${meName ? ", " + esc(meName) : ""}</h1></div>
    <div class="avatar">${esc(initials(user(S.me)?.name))}</div></header>`;
  const items = [
    ...S.activity.expenses.map(e => ({ kind: "e", date: e.date, at: e.created_at || "", data: e })),
    ...S.activity.settlements.map(s => ({ kind: "s", date: s.date, at: s.created_at || "", data: s })),
  ].sort((a, b) => b.date.localeCompare(a.date) || b.at.localeCompare(a.at));

  let list = "";
  if (!items.length) {
    list = `<div class="list"><div class="empty">Nog niets deze maand.<br>Tik op <b>+</b> om een uitgave toe te voegen.</div></div>`;
  } else {
    let lastDay = null, open = false;
    for (const it of items) {
      if (it.date !== lastDay) {
        if (open) list += `</div>`;
        list += `<div class="day">${esc(dayLabel(it.date))}</div><div class="list">`;
        lastDay = it.date; open = true;
      }
      if (it.kind === "e") {
        const e = it.data, c = cat(e.category_id), col = catColor(e.category_id);
        list += `<button class="item ${S.fresh === "e" + e.id ? "fresh" : ""}" data-act="edit" data-id="${e.id}">
          <div class="ico" style="background:${tint(col, .16)};box-shadow:inset 0 0 0 1px ${tint(col, .3)}">${catIcon(c?.icon)}</div>
          <div class="main"><div class="title">${esc(e.description)}${e.recurring_id ? REPEAT_ICON : ""}</div>
            <div class="meta">${esc(nameOf(e.paid_by, true))} betaalde${c ? " · " + esc(c.name) : ""}</div></div>
          <div class="right"><div class="amt tnum">${fmt(e.amount)}</div>${expenseEffect(e)}</div></button>`;
      } else {
        const s = it.data;
        list += `<button class="item ${S.fresh === "s" + s.id ? "fresh" : ""}" data-act="settlement" data-id="${s.id}">
          <div class="ico" style="background:rgba(30,154,114,.12);box-shadow:inset 0 0 0 1px rgba(30,154,114,.25);color:#1e9a72">${SWAP_ICON}</div>
          <div class="main"><div class="title">${esc(nameOf(s.from_user, true))} betaalde ${esc(nameObj(s.to_user))}</div>
            <div class="meta">Afgerekend</div></div>
          <div class="right"><div class="amt tnum">${fmt(s.amount)}</div></div></button>`;
      }
    }
    if (open) list += `</div>`;
  }
  return header + `<div class="cols"><div class="col col-side">${renderHero()}${renderTiles()}</div><div class="col">${monthNav()}${list}</div></div>`;
}

// ------------------------------------------------------------ taken
const REPEAT_WORDS = { day: ["dag", "dagen"], week: ["week", "weken"], month: ["maand", "maanden"] };
const REPEAT_OPTS = [["", "Niet herhalen"], ["day:1", "Elke dag"], ["week:1", "Elke week"], ["week:2", "Elke 2 weken"], ["month:1", "Elke maand"]];
const PLUS_ICON = '<svg class="ci" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>';
const findTask = id => [...S.tasks.open, ...S.tasks.done].find(t => t.id === id);
const addDaysISO = n => { const d = new Date(); d.setDate(d.getDate() + n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function repeatText(t) {
  const w = REPEAT_WORDS[t.repeat_unit];
  if (!w) return "";
  return t.repeat_every === 1 ? "elke " + w[0] : `elke ${t.repeat_every} ${w[1]}`;
}
function taskDue(iso) {
  const d = new Date(iso + "T00:00");
  const diff = Math.round((d - new Date(todayISO() + "T00:00")) / 864e5);
  if (diff === 0) return "Vandaag";
  if (diff === 1) return "Morgen";
  if (diff === -1) return "Gisteren";
  if (diff > 1 && diff < 7) return cap(d.toLocaleDateString("nl-NL", { weekday: "long" }));
  return d.toLocaleDateString("nl-NL", { day: "numeric", month: "short", ...(d.getFullYear() !== new Date().getFullYear() ? { year: "numeric" } : {}) }).replace(".", "");
}
// done_at komt als UTC-tijd uit de database.
function doneWhen(ts) {
  const d = new Date(String(ts).replace(" ", "T") + "Z");
  if (isNaN(d)) return "";
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return dayLabel(d.toISOString().slice(0, 10));
}

function visibleTasks() {
  const keep = t => S.taskFilter !== "mine" || !t.assigned_to || t.assigned_to === S.me;
  return { open: S.tasks.open.filter(keep), done: S.tasks.done.filter(keep) };
}

function taskRow(t, isDone) {
  const late = !isDone && t.due_date && t.due_date < todayISO();
  const bits = [];
  if (isDone) {
    if (t.done_at) bits.push(`<span>${esc(nameOf(t.done_by, true))} · ${esc(doneWhen(t.done_at))}</span>`);
  } else {
    if (t.due_date) bits.push(`<span class="${late ? "late" : ""}">${esc(taskDue(t.due_date))}</span>`);
    if (t.repeat_unit) bits.push(`<span>${REPEAT_ICON.replace(' rep"', '"')}${esc(repeatText(t))}</span>`);
    if (t.repeat_unit && t.done_by) bits.push(`<span>laatst door ${esc(nameObj(t.done_by))}</span>`);
  }
  const who = t.assigned_to ? `<span class="tav" title="${esc(nameOf(t.assigned_to, true))}">${esc(initials(user(t.assigned_to)?.name))}</span>` : "";
  return `<div class="task ${isDone ? "is-done" : ""} ${S.fresh === "t" + t.id ? "fresh" : ""}">
    <button class="tcheck" data-act="${isDone ? "task-reopen" : "task-done"}" data-id="${t.id}" aria-label="${isDone ? "Weer openen" : "Afvinken"}"><span class="check ${isDone ? "on" : ""}">${CHECK_ICON}</span></button>
    <button class="tmain" data-act="edit-task" data-id="${t.id}"><span class="title">${esc(t.title)}</span>${bits.length ? `<span class="meta">${bits.join("")}</span>` : ""}</button>${who}</div>`;
}

function renderTaskList() {
  const { open } = visibleTasks();
  const today = todayISO();
  const hasDates = open.some(t => t.due_date);
  const groups = [
    ["Te laat", open.filter(t => t.due_date && t.due_date < today), "late"],
    ["Vandaag", open.filter(t => t.due_date === today), ""],
    ["Binnenkort", open.filter(t => t.due_date && t.due_date > today), ""],
    [hasDates ? "Zonder datum" : "Open", open.filter(t => !t.due_date), ""],
  ].filter(g => g[1].length);
  if (!groups.length) {
    const text = !S.tasks.open.length ? "Nog geen taken." : "Niets voor jou te doen.";
    return `<div class="list"><div class="empty">${text}<br>Typ hierboven een taak of tik op <b>+</b>.</div></div>`;
  }
  return groups.map(([label, items, cls]) =>
    `<div class="day ${cls}">${label}</div><div class="list">${items.map(t => taskRow(t, false)).join("")}</div>`).join("");
}

function renderTaskDone() {
  const { done } = visibleTasks();
  if (!done.length) return "";
  return `<button class="linkbtn donetoggle" data-act="toggle-done">${S.showDone ? "Verberg" : "Toon"} afgerond (${done.length})</button>` +
    (S.showDone ? `<div class="list">${done.map(t => taskRow(t, true)).join("")}</div>` : "");
}

const taskSegInner = () => ["all", "mine"].map(f =>
  `<button data-act="task-filter" data-f="${f}" class="${S.taskFilter === f ? "on" : ""}">${f === "all" ? "Alles" : "Mijn"}</button>`).join("");

function renderTasks() {
  return `<header class="hello"><div class="txt"><div class="date">Kostendeler</div><h1>Taken</h1></div>
      <div class="seg" id="taskseg">${taskSegInner()}</div></header>
    <div class="cols"><div class="col">
      <form class="quickadd" id="qa" autocomplete="off"><input class="input" id="qa-input" placeholder="Nieuwe taak…" maxlength="200" enterkeyhint="done" aria-label="Nieuwe taak">
        <button class="btn primary" type="submit" aria-label="Toevoegen">${PLUS_ICON}</button></form>
      <div id="tasklist">${renderTaskList()}</div></div>
    <div class="col"><div id="taskdone">${renderTaskDone()}</div></div></div>`;
}

async function completeTask(id, row) {
  if (!row || row.classList.contains("finishing")) return;
  row.classList.add("finishing"); buzz();
  try {
    // Het vinkje krijgt even de tijd om te laten zien dat het gelukt is.
    const [r] = await Promise.all([api("POST", `/tasks/${id}/complete`, { today: todayISO() }),
      new Promise(res => setTimeout(res, reduceMotion() ? 0 : 420))]);
    await refresh();
    const msg = r.task.repeat_unit ? `Klaar, volgende keer ${taskDue(r.task.due_date).toLowerCase()}` : "Afgevinkt";
    toast(msg, { label: "Ongedaan maken", fn: async () => {
      try { await api("PUT", "/tasks/" + id, { ...r.previous, done: false }); buzz(); await refresh(); toast("Teruggezet"); }
      catch (err) { toast(err.message); }
    } });
  } catch (err) { row.classList.remove("finishing"); toast(err.message); }
}

async function reopenTask(id) {
  try { await api("POST", `/tasks/${id}/reopen`); buzz(); await refresh(); toast("Weer open"); }
  catch (err) { toast(err.message); }
}

function taskSheet(existing) {
  const T = existing
    ? { id: existing.id, who: existing.assigned_to, rep: existing.repeat_unit ? `${existing.repeat_unit}:${existing.repeat_every}` : "" }
    : { id: null, who: null, rep: "" };
  const repOpts = [...REPEAT_OPTS];
  if (T.rep && !repOpts.some(o => o[0] === T.rep)) repOpts.push([T.rep, cap(repeatText(existing))]);
  openSheet(`
    <h3>${existing ? "Taak bewerken" : "Nieuwe taak"}</h3>
    <div class="field"><label for="t-title">Wat moet er gebeuren?</label>
      <input class="input" id="t-title" maxlength="200" placeholder="Bijv. Vuilnisbak buiten zetten" value="${esc(existing?.title || "")}"></div>
    <div class="field"><span class="label">Voor wie</span><div class="chips" id="t-who"></div></div>
    <div class="field"><label for="t-due">Deadline</label>
      <input class="input" type="date" id="t-due" value="${esc(existing?.due_date || "")}">
      <div class="chips" id="t-quick" style="margin-top:10px"></div></div>
    <div class="field"><label for="t-rep">Herhalen</label>
      <select class="input" id="t-rep">${repOpts.map(([v, l]) => `<option value="${v}" ${v === T.rep ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
      <div class="hint" id="t-rephint"></div></div>
    <button class="btn primary block" id="t-save">Opslaan</button>
    ${existing ? `<div class="row-actions">${existing.done ? "" : `<button class="btn" id="t-exp">Uitgave van maken</button>`}<button class="btn danger" id="t-del">Verwijderen</button></div>` : ""}
  `, sheet => {
    const $ = s => sheet.querySelector(s);
    const popSel = sel => { const el = sheet.querySelector(sel); if (el) el.classList.add("pop"); };
    const drawWho = () => $("#t-who").innerHTML = [`<button class="chip ${T.who == null ? "on" : ""}" data-u="">Iedereen</button>`,
      ...S.users.map(u => `<button class="chip ${T.who === u.id ? "on" : ""}" data-u="${esc(u.id)}">${esc(nameOf(u.id, true))}</button>`)].join("");
    const drawQuick = () => $("#t-quick").innerHTML = [["Vandaag", todayISO()], ["Morgen", addDaysISO(1)], ["Geen datum", ""]].map(([l, v]) =>
      `<button class="chip ${$("#t-due").value === v ? "on" : ""}" data-d="${v}">${l}</button>`).join("");
    const sync = () => {
      $("#t-save").disabled = !$("#t-title").value.trim();
      $("#t-rephint").textContent = $("#t-rep").value ? "Vink je de taak af, dan komt hij vanzelf terug op de eerstvolgende datum." : "";
    };
    drawWho(); drawQuick(); sync();
    if (!existing) setTimeout(() => $("#t-title").focus(), 250);

    $("#t-title").addEventListener("input", sync);
    $("#t-title").addEventListener("keydown", e => { if (e.key === "Enter" && !$("#t-save").disabled) $("#t-save").click(); });
    $("#t-who").addEventListener("click", e => {
      const b = e.target.closest("[data-u]"); if (!b) return;
      T.who = b.dataset.u || null; drawWho(); popSel(`#t-who [data-u="${CSS.escape(b.dataset.u)}"]`);
    });
    $("#t-quick").addEventListener("click", e => {
      const b = e.target.closest("[data-d]"); if (!b) return;
      $("#t-due").value = b.dataset.d;
      if (!b.dataset.d) $("#t-rep").value = ""; // herhalen heeft een datum nodig
      drawQuick(); sync(); popSel(`#t-quick [data-d="${b.dataset.d}"]`);
    });
    $("#t-due").addEventListener("change", () => { if (!$("#t-due").value) $("#t-rep").value = ""; drawQuick(); sync(); });
    $("#t-rep").addEventListener("change", () => {
      if ($("#t-rep").value && !$("#t-due").value) $("#t-due").value = todayISO();
      drawQuick(); sync();
    });

    $("#t-save").addEventListener("click", async () => {
      const [unit, every] = $("#t-rep").value ? $("#t-rep").value.split(":") : [null, 1];
      const body = { title: $("#t-title").value.trim(), assigned_to: T.who, due_date: $("#t-due").value || null,
        repeat_unit: unit, repeat_every: Number(every) };
      $("#t-save").disabled = true;
      try {
        const saved = T.id ? await api("PUT", "/tasks/" + T.id, body) : await api("POST", "/tasks", body);
        S.fresh = "t" + saved.id; buzz(); closeSheet(); toast(T.id ? "Bijgewerkt" : "Toegevoegd"); await refresh();
      } catch (err) { toast(err.message); $("#t-save").disabled = false; }
    });
    existing && $("#t-exp") && $("#t-exp").addEventListener("click", () =>
      expenseSheet(null, false, { description: existing.title, taskId: existing.id }));
    existing && $("#t-del").addEventListener("click", async () => {
      try {
        const r = await api("DELETE", "/tasks/" + T.id); buzz(); closeSheet(); await refresh();
        undoToast(`${existing.title} verwijderd`, "/tasks/restore", r.deleted, "t");
      } catch (err) { toast(err.message); }
    });
  });
}

function lineChart(hist) {
  const W = 320, H = 130, pad = 8;
  const max = Math.max(1, ...hist.map(h => h.total));
  const pts = hist.map((h, i) => [hist.length === 1 ? W / 2 : pad + i * (W - 2 * pad) / (hist.length - 1), H - 10 - (h.total / max) * (H - 30)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${d} L${pts[pts.length - 1][0]},${H} L${pts[0][0]},${H} Z`;
  const dots = hist.map((h, i) => h.month === S.month ? `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="5" class="dot" style="fill:var(--dot-fill);stroke:var(--chart-b)" stroke-width="2.5"/>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="ln" x1="0" x2="1"><stop offset="0" style="stop-color:var(--chart-a)"/><stop offset="1" style="stop-color:var(--chart-b)"/></linearGradient>
      <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--chart-area)"/><stop offset="1" style="stop-color:var(--chart-area);stop-opacity:0"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path class="area" d="${area}" fill="url(#ar)"/>
    <path class="line" pathLength="1" d="${d}" fill="none" stroke="url(#ln)" stroke-width="2.6" stroke-linecap="round"/>
    ${dots}</svg>`;
}

function statsHeader() {
  return `<header class="hello"><div class="txt"><div class="date">Kostendeler</div><h1>Cijfers</h1></div>
    <div class="seg"><button data-act="mode" data-m="month" class="${S.statsMode === "month" ? "on" : ""}">Maand</button><button data-act="mode" data-m="year" class="${S.statsMode === "year" ? "on" : ""}">Jaar</button></div></header>`;
}

function catRows(s, emptyText) {
  return s.per_category.map(r => {
    const c = cat(r.category_id), col = catColor(r.category_id);
    const pct = s.total ? Math.round(r.total / s.total * 100) : 0;
    const mine = r.shares[S.me] || 0;
    return `<div class="cat-row"><div class="top"><span class="cat-name">${catIcon(c?.icon)}${esc(c?.name || "Zonder categorie")}</span><b class="tnum">${fmt(r.total)}</b></div>
      <div class="bar"><i style="width:${pct}%;background:${col};box-shadow:0 2px 8px ${tint(col, .35)}"></i></div>
      <div class="sub tnum">${r.count}× · ${pct}% · jouw deel ${fmt(mine)}</div></div>`;
  }).join("") || `<div class="muted">${emptyText}</div>`;
}

function peopleRows(s) {
  return S.users.map(u => {
    const p = s.per_user[u.id] || { paid: 0, share: 0 };
    return `<div class="person-row"><span>${esc(nameOf(u.id, true))}</span>
      <span class="r tnum">betaalde <b>${fmt(p.paid)}</b> · deel <b>${fmt(p.share)}</b></span></div>`;
  }).join("");
}

function renderYear() {
  const s = S.ysummary, nowY = new Date().getFullYear();
  const nav = `<div class="monthnav" style="margin-top:0">
    <button class="iconbtn" data-act="prev-year" aria-label="Vorig jaar">‹</button><h2>${S.year}</h2>
    <button class="iconbtn" data-act="next-year" aria-label="Volgend jaar" ${S.year >= nowY ? "disabled" : ""}>›</button></div>`;
  if (!s || s.year !== String(S.year)) return statsHeader() + nav + `<div class="loading">Laden…</div>`;
  // Gemiddelde vanaf de eerste maand met uitgaven tot nu (of eind van het jaar).
  const firstIdx = s.history.findIndex(h => h.total > 0);
  const lastIdx = S.year < nowY ? 11 : new Date().getMonth();
  const avg = firstIdx < 0 ? 0 : Math.round(s.total / Math.max(1, lastIdx - firstIdx + 1));
  const max = Math.max(1, ...s.history.map(h => h.total));
  const bars = s.history.map(h => {
    const future = S.year === nowY && h.month > thisMonth();
    return `<button class="${h.month === thisMonth() ? "cur" : ""} ${future ? "future" : ""}" data-act="goto-month-from-year" data-m="${h.month}" ${future ? "disabled" : ""}>
      <span class="v tnum">${h.total ? Math.round(h.total / 100) : ""}</span><i style="height:${Math.max(h.total ? 4 : 0, Math.round(h.total / max * 100))}%"></i><small>${esc(monthShort(h.month).slice(0, 3))}</small></button>`;
  }).join("");
  return statsHeader() + nav + `
    <div class="cols"><div class="col"><div class="card"><div class="card-head">${ICON.wallet}<span class="sp">Totaal ${S.year}</span><span class="status tnum">gem. ${fmt(avg)} p/m</span></div>
      <div class="big tnum" style="margin-bottom:10px">${big(s.total, "ytotal")}</div>${peopleRows(s)}</div>
      <div class="card"><div class="card-head">${ICON.bars}<span class="sp">Per maand</span></div><div class="ybars">${bars}</div>
        <div class="hint" style="margin-top:12px">Tik op een maand voor de details.</div></div></div>
    <div class="col"><div class="card"><div class="card-head">${ICON.tag}<span class="sp">Per categorie</span></div>${catRows(s, "Geen uitgaven dit jaar.")}</div></div></div>`;
}

function renderStats() {
  if (S.statsMode === "year") return renderYear();
  const s = S.summary;
  if (!s || s.month !== S.month) return statsHeader() + monthNav() + `<div class="loading">Laden…</div>`;
  const people = peopleRows(s);
  const cats = catRows(s, "Geen uitgaven deze maand.");
  const hist = s.history.length > 1 ? `<div class="card"><div class="card-head">${ICON.chart}<span class="sp">Laatste maanden</span><span class="status tnum">${fmt(s.total)}</span></div>
    <div class="chart">${lineChart(s.history)}<div class="labels">${s.history.map(h =>
      `<button data-act="goto-month" data-m="${h.month}" class="${h.month === S.month ? "cur" : ""}">${esc(monthShort(h.month))}</button>`).join("")}</div></div></div>` : "";
  return statsHeader() + monthNav().replace('class="monthnav"', 'class="monthnav" style="margin-top:0"') + `
    <div class="cols"><div class="col"><div class="card"><div class="card-head">${ICON.wallet}<span class="sp">Totaal uitgegeven</span></div>
      <div class="big tnum" style="margin-bottom:10px">${big(s.total, "stotal")}</div>${people}</div>${hist}</div>
    <div class="col"><div class="card"><div class="card-head">${ICON.tag}<span class="sp">Per categorie</span></div>${cats}</div></div></div>`;
}

        <span class="who">Maandrapport op de 1e<span class="two muted" style="display:block;font-size:12px">Totaal, grootste kostenpost en openstaand saldo</span></span></div>
      <div class="split-row"><button class="check ${meU.task_reminder ? "on" : ""}" data-act="n-tasks" aria-label="Takenherinnering">${CHECK_ICON}</button>

        ${meU.task_reminder ? `<select class="input hoursel" id="n-hour" aria-label="Tijdstip">${Array.from({ length: 24 }, (_, h) =>

        <span class="who">Nieuwe taak voor jou<span class="two muted" style="display:block;font-size:12px">Als iemand anders een taak aan jou geeft</span></span></div>
      <div class="row-actions"><button class="btn" data-act="n-test" data-kind="report">Test rapport</button><button class="btn" data-act="n-test" data-kind="tasks">Test taken</button></div>` : ""}
