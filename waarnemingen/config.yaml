name: Waarnemingen
version: "0.1.0"
slug: waarnemingen
description: Recente natuurwaarnemingen van waarneming.nl in de buurt op een kaart.
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:binoculars
panel_title: Waarnemingen
# Ook gebruikers zonder adminrechten zien de app in de zijbalk.
panel_admin: false
# Nodig om je thuislocatie op te halen via de Supervisor.
homeassistant_api: true
# Instelbaar in het tabblad "Configuratie"; in de container te lezen uit /data/options.json
options:
  radius: 5000
  days: 7
schema:
  radius: int(500,10000)
  days: int(1,30)
