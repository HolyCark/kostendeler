// ------------------------------------------------------------ Home Assistant-koppeling
function copyText(text) {
  const done = () => toast("Gekopieerd");
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  fallback();
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy") ? done() : toast("Kopiëren lukte niet, selecteer de tekst zelf"); } catch { toast("Kopiëren lukte niet, selecteer de tekst zelf"); }
    ta.remove();
  }
}

function haSnippets(info) {
  const base = `http://${info.host || "HOSTNAAM-VAN-DE-ADD-ON"}:${info.port}`;
  const cmd = (name, path, field, varname) => `  ${name}:
    url: "${base}${path}"
    method: POST
    headers:
      Authorization: "Bearer ${info.key}"
    content_type: "application/json"
    payload: '{"${field}": "{{ ${varname} }}", "user": "{{ gebruiker }}"}'`;
  const rest = `rest_command:\n${cmd("kostendeler_boodschap", "/api/ha/groceries", "name", "naam")}\n${cmd("kostendeler_taak_klaar", "/api/ha/tasks/complete", "task", "taak")}`;
  const auto = (alias, action, field, value) => `alias: "${alias}"
triggers:
  - trigger: event
    event_type: tag_scanned
    event_data:
      tag_id: "JOUW-TAG-ID"
actions:
  - action: rest_command.${action}
    data:
      ${field}: "${value}"
      gebruiker: "{{ trigger.event.context.user_id }}"`;
  return { rest, a1: auto("NFC: wc-papier bijna op", "kostendeler_boodschap", "naam", "Wc-papier"),
    a2: auto("NFC: wc schoongemaakt", "kostendeler_taak_klaar", "taak", "Wc schoonmaken") };
}

function haSheet() {
  const show = info => {
    const sn = haSnippets(info);
    const box = (id, title, text, hint) => `<div class="field"><div class="toggle-line"><span class="label">${title}</span><button class="linkbtn" data-copy="${id}">Kopiëren</button></div>
      <textarea class="input copybox" id="${id}" readonly rows="${text.split("\n").length}">${esc(text)}</textarea>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
    return `<h3>NFC en automatiseringen</h3>
      <p class="muted" style="margin:0 0 16px">Laat Home Assistant iets op de boodschappenlijst zetten of een taak afvinken, bijvoorbeeld als je je telefoon tegen een NFC-sticker houdt.</p>
      ${box("ha-rest", "1 · In configuration.yaml", sn.rest, "Herstart Home Assistant daarna één keer. Bevat je sleutel, deel dit niet.")}
      ${box("ha-a1", "2 · Automatisering: iets op de lijst", sn.a1, "Maak een sticker aan via <b>Instellingen → Tags</b> en zet het tag-ID op de plek van JOUW-TAG-ID. Plak dit als YAML in een nieuwe automatisering.")}
      ${box("ha-a2", "3 · Automatisering: taak afvinken", sn.a2, "De taaknaam moet precies zo heten als in de app. Wie de sticker scant krijgt de punten.")}
      <div class="row-actions"><button class="btn danger" id="ha-rotate">Nieuwe sleutel</button></div>
      <div class="hint">Een nieuwe sleutel maakt de oude ongeldig: pas hem dan ook aan in configuration.yaml.</div>`;
  };
  openSheet(`<div class="loading" style="padding:30px 0">Laden…</div>`, async sheet => {
    const load = async (rotate) => {
      try {
        const info = await api(rotate ? "POST" : "GET", "/ha-info");
        sheet.innerHTML = `<div class="grip"></div>` + show(info);
        sheet.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => copyText(sheet.querySelector("#" + b.dataset.copy).value)));
        sheet.querySelector("#ha-rotate").addEventListener("click", () => { if (confirm("Nieuwe sleutel maken? De oude werkt dan niet meer.")) load(true).then(() => toast("Nieuwe sleutel gemaakt")); });
      } catch (err) { toast(err.message); closeSheet(); }
    };
    load(false);
  });
}

function lineChart(hist) {
  const W = 320, H = 130, pad = 8;
  const max = Math.max(1, ...hist.map(h => h.total));
  const pts = hist.map((h, i) => [hist.length === 1 ? W / 2 : pad + i * (W - 2 * pad) / (hist.length - 1), H - 10 - (h.total / max) * (H - 30)]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  const area = `${d} L${pts[pts.length - 1][0]},${H} L${pts[0][0]},${H} Z`;
  const dots = hist.map((h, i) => h.month === S.month ? `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="5" class="dot" style="fill:var(--dot-fill);stroke:var(--chart-b)" stroke-width="2.5"/>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="ln" x1="0" x2="1"><stop offset="0" style="stop-color:var(--chart-a)"/><stop offset="1" style="stop-color:var(--chart-b)"/></linearGradient>
      <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--chart-area)"/><stop offset="1" style="stop-color:var(--chart-area);stop-opacity:0"/></linearGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <path class="area" d="${area}" fill="url(#ar)"/>
    <path class="line" pathLength="1" d="${d}" fill="none" stroke="url(#ln)" stroke-width="2.6" stroke-linecap="round"/>
    ${dots}</svg>`;
}

function statsHeader() {
  return `<header class="hello"><div class="txt"><div class="date">Kostendeler</div><h1>Cijfers</h1></div>
    <div class="seg"><button data-act="mode" data-m="month" class="${S.statsMode === "month" ? "on" : ""}">Maand</button><button data-act="mode" data-m="year" class="${S.statsMode === "year" ? "on" : ""}">Jaar</button></div></header>`;
}

function catRows(s, emptyText) {
  return s.per_category.map(r => {
    const c = cat(r.category_id), col = catColor(r.category_id);
    const pct = s.total ? Math.round(r.total / s.total * 100) : 0;
    const mine = r.shares[S.me] || 0;
    return `<div class="cat-row"><div class="top"><span class="cat-name">${catIcon(c?.icon)}${esc(c?.name || "Zonder categorie")}</span><b class="tnum">${fmt(r.total)}</b></div>
      <div class="bar"><i style="width:${pct}%;background:${col};box-shadow:0 2px 8px ${tint(col, .35)}"></i></div>
      <div class="sub tnum">${r.count}× · ${pct}% · jouw deel ${fmt(mine)}</div></div>`;
  }).join("") || `<div class="muted">${emptyText}</div>`;
}

function peopleRows(s) {
  return S.users.map(u => {
    const p = s.per_user[u.id] || { paid: 0, share: 0 };
    return `<div class="person-row"><span>${esc(nameOf(u.id, true))}</span>
      <span class="r tnum">betaalde <b>${fmt(p.paid)}</b> · deel <b>${fmt(p.share)}</b></span></div>`;
  }).join("");
}

function renderYear() {
  const s = S.ysummary, nowY = new Date().getFullYear();
  const nav = `<div class="monthnav" style="margin-top:0">
    <button class="iconbtn" data-act="prev-year" aria-label="Vorig jaar">‹</button><h2>${S.year}</h2>
    <button class="iconbtn" data-act="next-year" aria-label="Volgend jaar" ${S.year >= nowY ? "disabled" : ""}>›</button></div>`;
  if (!s || s.year !== String(S.year)) return statsHeader() + nav + `<div class="loading">Laden…</div>`;
  // Gemiddelde vanaf de eerste maand met uitgaven tot nu (of eind van het jaar).
  const firstIdx = s.history.findIndex(h => h.total > 0);
  const lastIdx = S.year < nowY ? 11 : new Date().getMonth();
  const avg = firstIdx < 0 ? 0 : Math.round(s.total / Math.max(1, lastIdx - firstIdx + 1));
  const max = Math.max(1, ...s.history.map(h => h.total));
  const bars = s.history.map(h => {
    const future = S.year === nowY && h.month > thisMonth();
    return `<button class="${h.month === thisMonth() ? "cur" : ""} ${future ? "future" : ""}" data-act="goto-month-from-year" data-m="${h.month}" ${future ? "disabled" : ""}>
      <span class="v tnum">${h.total ? Math.round(h.total / 100) : ""}</span><i style="height:${Math.max(h.total ? 4 : 0, Math.round(h.total / max * 100))}%"></i><small>${esc(monthShort(h.month).slice(0, 3))}</small></button>`;
  }).join("");
  return statsHeader() + nav + `
    <div class="cols"><div class="col"><div class="card"><div class="card-head">${ICON.wallet}<span class="sp">Totaal ${S.year}</span><span class="status tnum">gem. ${fmt(avg)} p/m</span></div>
      <div class="big tnum" style="margin-bottom:10px">${big(s.total, "ytotal")}</div>${peopleRows(s)}</div>
      <div class="card"><div class="card-head">${ICON.bars}<span class="sp">Per maand</span></div><div class="ybars">${bars}</div>
        <div class="hint" style="margin-top:12px">Tik op een maand voor de details.</div></div></div>
    <div class="col"><div class="card"><div class="card-head">${ICON.tag}<span class="sp">Per categorie</span></div>${catRows(s, "Geen uitgaven dit jaar.")}</div></div></div>`;
}

function renderStats() {
  if (S.statsMode === "year") return renderYear();
  const s = S.summary;
  if (!s || s.month !== S.month) return statsHeader() + monthNav() + `<div class="loading">Laden…</div>`;
  const people = peopleRows(s);
  const cats = catRows(s, "Geen uitgaven deze maand.");
  const hist = s.history.length > 1 ? `<div class="card"><div class="card-head">${ICON.chart}<span class="sp">Laatste maanden</span><span class="status tnum">${fmt(s.total)}</span></div>
    <div class="chart">${lineChart(s.history)}<div class="labels">${s.history.map(h =>
      `<button data-act="goto-month" data-m="${h.month}" class="${h.month === S.month ? "cur" : ""}">${esc(monthShort(h.month))}</button>`).join("")}</div></div></div>` : "";
  return statsHeader() + monthNav().replace('class="monthnav"', 'class="monthnav" style="margin-top:0"') + `
    <div class="cols"><div class="col"><div class="card"><div class="card-head">${ICON.wallet}<span class="sp">Totaal uitgegeven</span></div>
      <div class="big tnum" style="margin-bottom:10px">${big(s.total, "stotal")}</div>${people}</div>${hist}</div>
    <div class="col"><div class="card"><div class="card-head">${ICON.tag}<span class="sp">Per categorie</span></div>${cats}</div></div></div>`;
}

function haCard() {
  if (S.notify === null || S.notify === undefined) return `<div class="hint" style="margin:0">Laden…</div>`;
  if (!S.notify.available) return `<div class="hint" style="margin:0">Sensoren en automatiseringen werken alleen als de app als add-on in Home Assistant draait.</div>`;
  const slugs = S.users.map(u => u.name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "persoon");
  const sensors = [...slugs.map(sl => "kostendeler_saldo_" + sl), "kostendeler_taken_vandaag", "kostendeler_taken_te_laat", "kostendeler_boodschappen"];
  return `<div class="hint" style="margin:0 0 10px">De app zet deze sensoren in Home Assistant, voor je dashboard of automatiseringen (bijvoorbeeld een lamp die kleurt als er een taak te laat is):</div>
    <div class="sensorlist">${sensors.map(x => `<code>sensor.${esc(x)}</code>`).join("")}</div>
    <button class="btn" data-act="ha-setup" style="margin-top:14px">NFC en automatiseringen instellen</button>`;
}

function renderSettings() {
  const cats = S.categories.map(c => `<button class="settings-item" data-act="edit-cat" data-id="${c.id}">
    <span class="ico" style="width:36px;height:36px;flex-basis:36px;background:${tint(catColor(c.id), .16)}">${catIcon(c.icon)}</span>
    <span class="grow ${c.archived ? "muted" : ""}">${esc(c.name)}${c.archived ? " (verborgen)" : ""}</span><span class="muted">›</span></button>`).join("");
  const users = S.users.map(u => `<div class="settings-item"><span class="avatar ucol" style="width:36px;height:36px;flex-basis:36px;font-size:13px;${ucol(u.id)}">${esc(initials(u.name))}</span>
    <span class="grow">${esc(u.name)}${u.id === S.me ? " <span class='muted'>(jij)</span>" : ""}</span></div>`).join("");
  const recs = S.recurring.map(r => {
    const c = cat(r.category_id);
    const when = r.day === 31 ? "laatste dag van de maand" : `elke ${r.day}e van de maand`;
    const next = r.active ? `volgende ${new Date(r.next_date + "T00:00").toLocaleDateString("nl-NL", { day: "numeric", month: "short" }).replace(".", "")}` : "gepauzeerd";
    return `<button class="settings-item" data-act="edit-rec" data-id="${r.id}">
      <span class="ico" style="width:36px;height:36px;flex-basis:36px;background:${tint(catColor(r.category_id), .16)};${r.active ? "" : "opacity:.45"}">${catIcon(c?.icon)}</span>
      <span class="grow ${r.active ? "" : "muted"}">${esc(r.description)}<span class="two">${fmt(r.amount)} · ${when}</span></span>
      <span class="muted side">${esc(next)}</span></button>`;
  }).join("") || `<div class="hint" style="margin:0">Huur, internet of energie? Voeg ze hier toe, dan zet de app ze elke maand op de gekozen dag automatisch in de lijst.</div>`;
  if (S.notify === undefined) {
    S.notify = null;
    api("GET", "/notify/services").then(r => { S.notify = r; if (S.tab === "settings") render(); })
      .catch(() => { S.notify = { available: false, services: [] }; if (S.tab === "settings") render(); });
  }
  const meU = user(S.me) || {};
  let notifyBody;
  if (S.notify === null) notifyBody = `<div class="hint" style="margin:0">Laden…</div>`;
  else if (!S.notify.available) notifyBody = `<div class="hint" style="margin:0">Meldingen werken alleen als de app als add-on in Home Assistant draait.</div>`;
  else {
    const opts = [...new Set([...S.notify.services, ...(meU.notify_service ? [meU.notify_service] : [])])];
    notifyBody = `<div class="field" style="margin-bottom:10px"><label for="n-svc">Stuur meldingen naar</label>
      <select class="input" id="n-svc"><option value="">Geen meldingen</option>${opts.map(o =>
        `<option value="${esc(o)}" ${o === meU.notify_service ? "selected" : ""}>${esc(prettySvc(o))}</option>`).join("")}</select></div>
      ${meU.notify_service ? `<div class="split-row"><button class="check ${meU.monthly_report ? "on" : ""}" data-act="n-report" aria-label="Maandrapport">${CHECK_ICON}</button>
        <span class="who">Maandrapport op de 1e<span class="two muted" style="display:block;font-size:12px">Totaal, grootste kostenpost en openstaand saldo</span></span></div>
      <div class="split-row"><button class="check ${meU.task_reminder ? "on" : ""}" data-act="n-tasks" aria-label="Takenherinnering">${CHECK_ICON}</button>
        <span class="who">Taken van vandaag<span class="two muted" style="display:block;font-size:12px">Alleen als er iets op de lijst staat</span></span>
        ${meU.task_reminder ? `<select class="input hoursel" id="n-hour" aria-label="Tijdstip">${Array.from({ length: 24 }, (_, h) =>
          `<option value="${h}" ${h === meU.task_reminder_hour ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`).join("")}</select>` : ""}</div>
      <div class="split-row"><button class="check ${meU.task_assigned ? "on" : ""}" data-act="n-assigned" aria-label="Nieuwe taak voor jou">${CHECK_ICON}</button>
        <span class="who">Nieuwe taak voor jou<span class="two muted" style="display:block;font-size:12px">Als iemand anders een taak aan jou geeft</span></span></div>
      <div class="row-actions"><button class="btn" data-act="n-test" data-kind="report">Test rapport</button><button class="btn" data-act="n-test" data-kind="tasks">Test taken</button></div>` : ""}
      <div class="hint">${opts.length ? "Ieder kiest dit voor zijn of haar eigen account." : "Geen apparaten gevonden. Installeer de Home Assistant Companion-app en log in."}</div>`;
  }
  return `
    <header class="hello"><div class="txt"><div class="date">Kostendeler</div><h1>Instellingen</h1></div></header>
    <div class="cols"><div class="col"><div class="card"><div class="card-head">${REPEAT_ICON.replace('class="ci rep"', 'class="ci"')}<span class="sp">Vaste kosten</span><button class="linkbtn" data-act="add-rec">+ Nieuwe</button></div>${recs}</div>
    <div class="card"><div class="card-head">${ICON.tag}<span class="sp">Categorieën</span><button class="linkbtn" data-act="add-cat">+ Nieuwe</button></div>${cats}</div></div>
    <div class="col"><div class="card"><div class="card-head">${ICON.bell}<span class="sp">Meldingen</span></div>${notifyBody}</div>
    <div class="card"><div class="card-head">${ICON.people}<span class="sp">Huisgenoten</span></div>${users}
      <div class="hint">${S.ingress
        ? "Iedereen met een Home Assistant-account verschijnt hier zodra die de app één keer opent."
        : `Terugvalmodus (geen Home Assistant-login). <button class="linkbtn" data-act="switch-user">Wissel van gebruiker</button>`}</div></div>
    <div class="card"><div class="card-head">${ICON.home}<span class="sp">Home Assistant</span></div>${haCard()}</div>
    <div class="card"><div class="card-head">${ICON.lock}<span class="sp">Privacy</span></div><div class="hint" style="margin:0">Alle gegevens staan in een SQLite-database op je eigen Home Assistant en gaan mee in de HA-back-ups. Er gaat niets naar buiten.</div></div></div></div>`;
}

// ------------------------------------------------------------ sheets
function openSheet(html, onMount) {
  const root = document.getElementById("overlay-root");
  root.innerHTML = `<div class="overlay" id="ov"><div class="sheet" role="dialog"><div class="grip"></div>${html}</div></div>`;
  const ov = document.getElementById("ov");
  ov.addEventListener("click", e => { if (e.target === ov) closeSheet(); });
  onMount && onMount(ov.querySelector(".sheet"));
}
function closeSheet() {
  const ov = document.getElementById("ov");
  if (!ov) return;
  ov.removeAttribute("id");
  if (reduceMotion()) return ov.remove();
  ov.classList.add("closing");
  setTimeout(() => ov.remove(), 200);
}

// ---- uitgave toevoegen / bewerken
function expenseSheet(existing, recurring = false, prefill = null) {
  const activeCats = S.categories.filter(c => !c.archived || c.id === existing?.category_id);
  const fixedCat = S.categories.find(c => c.name === "Vaste lasten" && !c.archived);
  // Vanuit een taak (bijv. boodschappen): omschrijving alvast ingevuld, taak wordt na opslaan afgevinkt.
  const defaultCat = recurring && fixedCat ? fixedCat : (prefill && activeCats.find(c => c.name === "Boodschappen")) || activeCats[0];
  const F = existing ? {
    id: existing.id, amount: centsToInput(existing.amount), description: existing.description,
    category_id: existing.category_id, paid_by: existing.paid_by, date: existing.date,
    who: new Set(Object.keys(existing.shares)), custom: false, customVals: {},
  } : {
    id: null, amount: "", description: prefill?.description || "", category_id: defaultCat?.id ?? null,
    paid_by: S.me, date: todayISO(), who: new Set(S.users.map(u => u.id)), custom: false, customVals: {},
  };
  F.day = existing?.day ?? Math.min(new Date().getDate(), 28);
  const canRepeat = !recurring && !existing && !prefill;
  F.includeNow = true;
  // Bewerken: als de opgeslagen verdeling niet gelijk is, open in aangepaste modus.
  if (existing) {
    const eq = equalSplit(existing.amount, S.users.map(u => u.id).filter(id => F.who.has(id)));
    if (Object.entries(existing.shares).some(([u, c]) => eq[u] !== c)) {
      F.custom = true;
      S.users.forEach(u => F.customVals[u.id] = existing.shares[u.id] ? centsToInput(existing.shares[u.id]) : "");
    }
  }

  openSheet(`
    <h3>${recurring ? (existing ? "Vaste uitgave bewerken" : "Nieuwe vaste uitgave") : (existing ? "Uitgave bewerken" : "Nieuwe uitgave")}</h3>
    <div class="field"><div class="amount-input"><span>€</span>
      <input id="f-amount" inputmode="decimal" placeholder="0,00" value="${esc(F.amount)}" autocomplete="off"></div></div>
    <div class="field"><label for="f-desc">Omschrijving</label>
      <input class="input" id="f-desc" placeholder="${recurring ? "Bijv. Huur" : "Bijv. Albert Heijn"}" maxlength="200" value="${esc(F.description)}"></div>
    <div class="field"><span class="label">Categorie</span><div class="chips" id="f-cats"></div></div>
    <div class="field"><span class="label">Betaald door</span><div class="chips" id="f-payer"></div></div>
    <div class="field"><div class="toggle-line"><span class="label">Voor wie</span>
      <button class="linkbtn" id="f-mode"></button></div><div id="f-split"></div><div class="hint" id="f-hint"></div></div>
    ${recurring ? `<div class="field"><label for="f-day">Elke maand op</label>
      <select class="input" id="f-day">${Array.from({ length: 31 }, (_, i) => i + 1).map(d =>
        `<option value="${d}" ${d === F.day ? "selected" : ""}>${d === 31 ? "de laatste dag" : `de ${d}e`}</option>`).join("")}</select>
      ${existing ? "" : `<div class="split-row hidden" id="f-now-row"><button class="check on" id="f-now" aria-label="Deze maand ook toevoegen">${CHECK_ICON}</button>
        <span class="who">Deze maand ook al toevoegen</span></div>`}
      <div class="hint">Wordt op die dag automatisch toegevoegd. Wijkt een bedrag een keer af? Pas die uitgave dan aan in de lijst.</div></div>`
    : `<div class="field"><label for="f-date">Datum</label><input class="input" type="date" id="f-date" value="${esc(F.date)}"></div>
      ${canRepeat ? `<div class="field"><label for="f-repeat">Herhalen</label>
        <select class="input" id="f-repeat"><option value="">Niet herhalen</option><option value="month">Elke maand</option></select>
        <div class="hint" id="f-rephint"></div></div>` : ""}`}
    <button class="btn primary block" id="f-save">Opslaan</button>
    ${existing ? `<div class="row-actions">${recurring ? `<button class="btn" id="f-pause">${existing.active ? "Pauzeren" : "Hervatten"}</button>` : ""}<button class="btn danger" id="f-del">Verwijderen</button></div>` : ""}
  `, sheet => {
    const $ = s => sheet.querySelector(s);
    const amountEl = $("#f-amount");
    const popSel = sel => { const el = sheet.querySelector(sel); if (el) el.classList.add("pop"); };

    const drawCats = () => $("#f-cats").innerHTML = activeCats.map(c =>
      `<button class="chip ${F.category_id === c.id ? "on" : ""}" data-c="${c.id}">${catIcon(c.icon)}${esc(c.name)}</button>`).join("");
    const drawPayer = () => $("#f-payer").innerHTML = S.users.map(u =>
      `<button class="chip ${F.paid_by === u.id ? "on" : ""}" data-u="${esc(u.id)}">${esc(nameOf(u.id, true))}</button>`).join("");

    function currentShares() {
      const total = parseAmount(amountEl.value);
      if (F.custom) {
        const sh = {};
        for (const u of S.users) { const v = parseAmount(F.customVals[u.id]); sh[u.id] = (v && !isNaN(v)) ? v : 0; }
        return { total, shares: sh };
      }
      return { total, shares: total > 0 ? equalSplit(total, S.users.map(u => u.id).filter(id => F.who.has(id))) : {} };
    }

    function drawSplit() {
      $("#f-mode").textContent = F.custom ? "Gelijk verdelen" : "Bedragen aanpassen";
      const { total, shares } = currentShares();
      $("#f-split").innerHTML = S.users.map(u => F.custom
        ? `<div class="split-row"><span class="who">${esc(nameOf(u.id, true))}</span>
             <input class="input tnum" inputmode="decimal" placeholder="0,00" data-cu="${esc(u.id)}" value="${esc(F.customVals[u.id] || "")}"></div>`
        : `<div class="split-row"><button class="check ${F.who.has(u.id) ? "on" : ""}" data-w="${esc(u.id)}" aria-label="${esc(u.name)}">${CHECK_ICON}</button>
             <span class="who">${esc(nameOf(u.id, true))}</span><span class="muted tnum">${F.who.has(u.id) && total > 0 ? fmt(shares[u.id]) : ""}</span></div>`
      ).join("");
      updateHint();
    }

    function updateHint() {
      const { total, shares } = currentShares();
      const hint = $("#f-hint"), save = $("#f-save");
      hint.classList.remove("warn");
      let ok = total > 0 && !isNaN(total) && $("#f-desc").value.trim() !== "";
      if (isNaN(total)) { hint.textContent = "Ongeldig bedrag"; hint.classList.add("warn"); ok = false; }
      else if (F.custom) {
        const sum = Object.values(shares).reduce((a, b) => a + b, 0);
        const rest = (total || 0) - sum;
        if (rest !== 0) { hint.textContent = rest > 0 ? `Nog te verdelen: ${fmt(rest)}` : `${fmt(-rest)} te veel verdeeld`; hint.classList.add("warn"); ok = false; }
        else hint.textContent = summaryText(F.paid_by, shares);
      } else if (!F.who.size) { hint.textContent = "Kies minstens één persoon"; hint.classList.add("warn"); ok = false; }
      else hint.textContent = total > 0 ? summaryText(F.paid_by, shares) : "";
      save.disabled = !ok;
    }

    drawCats(); drawPayer(); drawSplit();
    if (!existing) setTimeout(() => amountEl.focus(), 250);

    amountEl.addEventListener("input", () => { if (F.custom) updateHint(); else drawSplit(); });
    $("#f-desc").addEventListener("input", updateHint);
    $("#f-cats").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; F.category_id = Number(b.dataset.c); F.catTouched = true; drawCats(); popSel(`[data-c="${b.dataset.c}"]`); });
    $("#f-payer").addEventListener("click", e => { const b = e.target.closest("[data-u]"); if (!b) return; F.paid_by = b.dataset.u; drawPayer(); updateHint(); popSel(`#f-payer [data-u="${CSS.escape(b.dataset.u)}"]`); });
    $("#f-mode").addEventListener("click", () => {
      if (!F.custom) {
        const { shares } = currentShares();
        S.users.forEach(u => F.customVals[u.id] = shares[u.id] ? centsToInput(shares[u.id]) : "");
      } else {
        F.who = new Set(S.users.map(u => u.id).filter(id => parseAmount(F.customVals[id]) > 0));
        if (!F.who.size) F.who = new Set(S.users.map(u => u.id));
      }
      F.custom = !F.custom; drawSplit();
    });
    $("#f-split").addEventListener("click", e => {
      const b = e.target.closest("[data-w]"); if (!b) return;
      F.who.has(b.dataset.w) ? F.who.delete(b.dataset.w) : F.who.add(b.dataset.w); drawSplit(); popSel(`[data-w="${CSS.escape(b.dataset.w)}"]`);
    });
    $("#f-split").addEventListener("input", e => {
      const i = e.target.closest("[data-cu]"); if (!i) return;
      F.customVals[i.dataset.cu] = i.value; updateHint();
    });

    if (canRepeat) {
      const syncRep = () => {
        const on = $("#f-repeat").value === "month", d = Number(($("#f-date").value || todayISO()).slice(8, 10));
        $("#f-rephint").textContent = on ? `Komt vanaf nu elke maand op ${d >= 31 ? "de laatste dag" : `de ${d}e`} vanzelf in de lijst${d > 28 && d < 31 ? " (of de laatste dag als de maand korter is)" : ""}. Aanpassen of stoppen kan bij Instellingen → Vaste kosten.` : "";
        if (on && fixedCat && !F.catTouched && F.category_id !== fixedCat.id) { F.category_id = fixedCat.id; drawCats(); }
        $("#f-save").textContent = on ? "Opslaan en herhalen" : "Opslaan";
      };
      $("#f-repeat").addEventListener("change", syncRep); $("#f-date").addEventListener("change", syncRep);
    }
    if (recurring && !existing) {
      const syncNow = () => $("#f-now-row").classList.toggle("hidden", Number($("#f-day").value) >= new Date().getDate());
      $("#f-day").addEventListener("change", syncNow); syncNow();
      $("#f-now").addEventListener("click", () => { F.includeNow = !F.includeNow; $("#f-now").classList.toggle("on", F.includeNow); $("#f-now").classList.add("pop"); });
    }
    recurring && existing && $("#f-pause").addEventListener("click", async () => {
      try { await api("PUT", "/recurring/" + F.id, { active: !existing.active }); buzz(); closeSheet();
        toast(existing.active ? "Gepauzeerd" : "Hervat"); await refresh(); }
      catch (err) { toast(err.message); }
    });

    $("#f-save").addEventListener("click", async () => {
      const { total, shares } = currentShares();
      if (recurring) {
        const body = { description: $("#f-desc").value.trim(), amount: total, paid_by: F.paid_by,
          category_id: F.category_id, shares, day: Number($("#f-day").value), include_current: F.includeNow };
        $("#f-save").disabled = true;
        try {
          if (F.id) await api("PUT", "/recurring/" + F.id, body); else await api("POST", "/recurring", body);
          buzz(); closeSheet(); toast("Vaste uitgave opgeslagen"); await refresh();
        } catch (err) { toast(err.message); $("#f-save").disabled = false; }
        return;
      }
      const body = { description: $("#f-desc").value.trim(), amount: total, paid_by: F.paid_by,
        date: $("#f-date").value || todayISO(), category_id: F.category_id, shares };
      const repeating = canRepeat && $("#f-repeat").value === "month";
      if (repeating) body.repeat = "month";
      $("#f-save").disabled = true;
      try {
        const saved = F.id ? await api("PUT", "/expenses/" + F.id, body) : await api("POST", "/expenses", body);
        S.fresh = "e" + saved.id; buzz();
        let msg = F.id ? "Bijgewerkt" : repeating ? "Toegevoegd · herhaalt elke maand" : "Toegevoegd";
        if (prefill?.groceryCheckout) {
          try { const c = await api("POST", "/groceries/checkout", { expense_id: saved.id }); msg = `Afgerekend · ${c.count} ${c.count === 1 ? "boodschap" : "boodschappen"}`; } catch {}
        }
        if (prefill?.taskId) {
          try { await api("POST", `/tasks/${prefill.taskId}/complete`, { today: todayISO() }); msg = "Toegevoegd en afgevinkt"; } catch {}
        }
        closeSheet(); S.month = body.date.slice(0, 7); toast(msg); await refresh();
      } catch (err) { toast(err.message); $("#f-save").disabled = false; }
    });
    existing && $("#f-del").addEventListener("click", async () => {
      if (recurring) {
        if (!confirm("Deze vaste uitgave verwijderen? Eerder toegevoegde bedragen blijven in de lijst staan.")) return;
        try { await api("DELETE", "/recurring/" + F.id); buzz(); closeSheet(); toast("Verwijderd"); await refresh(); }
        catch (err) { toast(err.message); }
        return;
      }
      try {
        const r = await api("DELETE", "/expenses/" + F.id); buzz(); closeSheet(); await refresh();
        undoToast(`${existing.description} verwijderd`, "/expenses/restore", r.deleted, "e");
      } catch (err) { toast(err.message); }
    });
  });
}

function equalSplit(total, ids) {
  const out = {};
  if (!ids.length) return out;
  const base = Math.floor(total / ids.length);
  let rest = total - base * ids.length;
  ids.forEach(id => { out[id] = base + (rest > 0 ? 1 : 0); if (rest > 0) rest--; });
  return out;
}

function summaryText(payer, shares) {
  const parts = Object.entries(shares).filter(([u, c]) => u !== payer && c > 0)
    .map(([u, c]) => `${nameOf(u, true)} betaalt ${fmt(c)} terug`);
  if (!parts.length) return `Alleen voor ${nameObj(payer)}, er hoeft niets verrekend te worden.`;
  return `${parts.join(", ")} aan ${nameObj(payer)}.`;
}

// ---- afrekenen
function settleSheet(sug) {
  openSheet(`
    <h3>Afrekenen</h3>
    <p style="margin:0 0 16px" class="muted">${esc(nameOf(sug.from, true))} betaalt ${esc(nameObj(sug.to))}. Doe dit bijvoorbeeld met een Tikkie en markeer het daarna hier als betaald.</p>
    <div class="field"><div class="amount-input"><span>€</span><input id="s-amount" class="tnum" inputmode="decimal" value="${centsToInput(sug.amount)}"></div>
      <div class="hint">Je kunt ook een deel afrekenen.</div></div>
    <div class="field"><label for="s-date">Datum</label><input class="input" type="date" id="s-date" value="${todayISO()}"></div>
    <button class="btn primary block" id="s-save">Markeer als betaald</button>
  `, sheet => {
    sheet.querySelector("#s-save").addEventListener("click", async () => {
      const amount = parseAmount(sheet.querySelector("#s-amount").value);
      if (!(amount > 0)) return toast("Ongeldig bedrag");
      try {
        const st = await api("POST", "/settlements", { from_user: sug.from, to_user: sug.to, amount, date: sheet.querySelector("#s-date").value || todayISO() });
        S.fresh = "s" + st.id; buzz();
        closeSheet(); toast("Afgerekend"); await refresh();
      } catch (err) { toast(err.message); }
    });
  });
}

function settlementSheet(s) {
  openSheet(`
    <h3>Afrekening</h3>
    <p style="margin:0 0 6px">${esc(nameOf(s.from_user, true))} betaalde ${esc(nameObj(s.to_user))} <b class="tnum">${fmt(s.amount)}</b></p>
    <p class="muted" style="margin:0 0 18px">${esc(dayLabel(s.date))}</p>
    <button class="btn danger block" id="x-del">Afrekening verwijderen</button>
    <div class="hint">Het saldo komt dan weer terug zoals het was.</div>
  `, sheet => sheet.querySelector("#x-del").addEventListener("click", async () => {
    try {
      const r = await api("DELETE", "/settlements/" + s.id); buzz(); closeSheet(); await refresh();
      undoToast("Afrekening verwijderd", "/settlements/restore", r.deleted, "s");
    } catch (err) { toast(err.message); }
  }));
}

// ---- categorieën
function categorySheet(c) {
  openSheet(`
    <h3>${c ? "Categorie bewerken" : "Nieuwe categorie"}</h3>
    <div class="field"><label for="c-name">Naam</label><input class="input" id="c-name" maxlength="40" value="${esc(c?.name || "")}"></div>
    <div class="field"><span class="label">Icoon</span><div class="icon-grid" id="c-icons">${Object.keys(CAT_ICONS).map(k => `<button class="icon-pick ${k === (c?.icon in CAT_ICONS ? c.icon : "box") ? "on" : ""}" data-k="${k}" aria-label="${k}">${catIcon(k)}</button>`).join("")}</div></div>
    <button class="btn primary block" id="c-save">Opslaan</button>
    ${c ? `<div class="row-actions"><button class="btn" id="c-arch">${c.archived ? "Weer tonen" : "Verbergen"}</button></div>
      <div class="hint">Verborgen categorieën blijven zichtbaar bij oude uitgaven.</div>` : ""}
  `, sheet => {
    const $ = s => sheet.querySelector(s);
    if (!c) setTimeout(() => $("#c-name").focus(), 250);
    $("#c-icons").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return;
      $("#c-icons").querySelectorAll(".on").forEach(x => x.classList.remove("on", "pop")); b.classList.add("on", "pop"); });
    $("#c-save").addEventListener("click", async () => {
      const body = { name: $("#c-name").value.trim(), icon: $("#c-icons .on")?.dataset.k || "box" };
      try {
        if (c) await api("PUT", "/categories/" + c.id, body); else await api("POST", "/categories", body);
        await reloadMeta(); closeSheet(); render();
      } catch (err) { toast(err.message); }
    });
    c && $("#c-arch").addEventListener("click", async () => {
      try { await api("PUT", "/categories/" + c.id, { archived: !c.archived }); await reloadMeta(); closeSheet(); render(); }
      catch (err) { toast(err.message); }
    });
  });
}

// ---- terugvalmodus zonder Ingress
function showWhoAmI() {
  document.getElementById("app").innerHTML = "";
  openSheet(`
    <h3>Wie ben jij?</h3>
    <div class="chips" id="w-list" style="margin-bottom:16px">${S.users.map(u => `<button class="chip" data-u="${esc(u.id)}">${esc(u.name)}</button>`).join("") || '<span class="muted">Nog geen personen.</span>'}</div>
    <div class="field"><label for="w-name">Of voeg jezelf toe</label><input class="input" id="w-name" placeholder="Naam"></div>
    <button class="btn primary block" id="w-add">Toevoegen</button>
    <div class="hint">Je opent de app buiten Home Assistant om. Open hem via de zijbalk van Home Assistant om automatisch ingelogd te zijn.</div>
  `, sheet => {
    sheet.querySelector("#w-list").addEventListener("click", e => {
      const b = e.target.closest("[data-u]"); if (!b) return;
      store.set("kostendeler-user", b.dataset.u); closeSheet(); boot();
    });
    sheet.querySelector("#w-add").addEventListener("click", async () => {
      try { const u = await api("POST", "/users", { name: sheet.querySelector("#w-name").value }); store.set("kostendeler-user", u.id); closeSheet(); boot(); }

// ------------------------------------------------------------ events
document.getElementById("fab").addEventListener("click", () => {
  if (S.tab === "tasks") return taskSheet(null);
  if (S.tab === "groceries") { window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" }); return document.getElementById("gqa-input")?.focus(); }
  expenseSheet(null);
});
document.getElementById("tabs").addEventListener("click", async e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  if (S.tab === b.dataset.tab) return;
  S.tab = b.dataset.tab; S.animate = true; syncTabs();
  refresh().then(() => window.scrollTo(0, 0)).catch(err => toast(err.message));
});
document.getElementById("app").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "prev-month" || act === "next-month" || act === "goto-month") {
    S.month = act === "goto-month" ? b.dataset.m : shiftMonth(S.month, act === "prev-month" ? -1 : 1);
    S.animate = true; refresh().catch(err => toast(err.message));
  } else if (act === "edit") expenseSheet(S.activity.expenses.find(x => x.id === Number(b.dataset.id)));
  else if (act === "settlement") settlementSheet(S.activity.settlements.find(x => x.id === Number(b.dataset.id)));
  else if (act === "settle") settleSheet(S.suggestions[Number(b.dataset.i)]);
  else if (act === "edit-cat") categorySheet(cat(Number(b.dataset.id)));
  else if (act === "add-cat") categorySheet(null);
  else if (act === "mode") { if (S.statsMode === b.dataset.m) return; S.statsMode = b.dataset.m; S.animate = true; refresh().catch(err => toast(err.message)); }
  else if (act === "prev-year" || act === "next-year") { S.year += act === "prev-year" ? -1 : 1; S.animate = true; refresh().catch(err => toast(err.message)); }
  else if (act === "goto-month-from-year") { S.statsMode = "month"; S.month = b.dataset.m; S.animate = true; refresh().catch(err => toast(err.message)); }
  else if (act === "n-report") saveMe({ monthly_report: !(user(S.me)?.monthly_report) }, "Opgeslagen");
  else if (act === "n-tasks") saveMe({ task_reminder: !(user(S.me)?.task_reminder) }, user(S.me)?.task_reminder ? "Takenherinnering uit" : "Takenherinnering aan");
  else if (act === "n-assigned") saveMe({ task_assigned: !(user(S.me)?.task_assigned) }, "Opgeslagen");
  else if (act === "n-test") {
    b.disabled = true;
    api("POST", "/notify/test", { kind: b.dataset.kind }).then(() => toast("Testmelding verstuurd")).catch(err => toast(err.message)).finally(() => (b.disabled = false));
  }
  else if (act === "add-rec") expenseSheet(null, true);
  else if (act === "edit-rec") expenseSheet(S.recurring.find(x => x.id === Number(b.dataset.id)), true);
  else if (act === "switch-user") { store.del("kostendeler-user"); S.me = null; boot(); }
  else if (act === "task-done") completeTask(Number(b.dataset.id), b.closest(".task"));
  else if (act === "task-reopen") reopenTask(Number(b.dataset.id));
  else if (act === "edit-task") { const t = findTask(Number(b.dataset.id)); t && taskSheet(t); }
  else if (act === "toggle-done") { S.showDone = !S.showDone; render(); }
  else if (act === "g-check") toggleGrocery(Number(b.dataset.id), b.closest(".task"));
  else if (act === "g-edit") { const it = S.groceries.items.find(i => i.id === Number(b.dataset.id)); it && grocerySheet(it); }
  else if (act === "g-staple") {
    const it = onListByName(b.dataset.name);
    b.classList.add("pop"); buzz();
    (it && it.status === "open" ? api("DELETE", "/groceries/" + it.id).then(() => toast(`${it.name} van de lijst`))
      : it ? Promise.resolve(toast(`${it.name} zit al in je mandje`)) : api("POST", "/groceries", { name: b.dataset.name }).then(r => { S.fresh = "g" + r.item.id; }))
      .then(refresh).catch(err => toast(err.message));
  }
  else if (act === "g-staples") staplesSheet();
  else if (act === "r-open") recipeSheet(S.groceries.recipes.find(r => r.id === Number(b.dataset.id)));
  else if (act === "r-new") recipeEditSheet(null);
  else if (act === "r-all") recipesAllSheet();
  else if (act === "g-checkout") {
    const names = S.groceries.items.filter(i => i.status === "basket").map(i => i.name);
    expenseSheet(null, false, { description: groceryDescription(names), groceryCheckout: true });
  }
  else if (act === "g-clear") api("POST", "/groceries/checkout", {}).then(r => { buzz(); toast(`Mandje leeg · ${r.count} afgerond`); return refresh(); }).catch(err => toast(err.message));
  else if (act === "open-settings") { S.tab = "settings"; S.animate = true; refresh().then(() => window.scrollTo(0, 0)).catch(err => toast(err.message)); }
  else if (act === "ha-setup") haSheet();
  else if (act === "task-filter") {
    if (S.taskFilter === b.dataset.f) return;
    S.taskFilter = b.dataset.f; store.set("kostendeler-taskfilter", S.taskFilter); render();
  }
});
// Snel een taak erbij: typ en druk op enter, het invoerveld blijft open voor de volgende.
document.getElementById("app").addEventListener("submit", async e => {
  if (e.target.id === "gqa") {
    e.preventDefault();
    const input = document.getElementById("gqa-input"), name = input.value.trim();
    if (!name || S.qaBusy) return;
    S.qaBusy = true;
    try { input.value = ""; await addGrocery(name); }
    catch (err) { input.value = name; toast(err.message); }
    finally { S.qaBusy = false; }
    return;
  }
  if (e.target.id !== "qa") return;
  e.preventDefault();
  const input = document.getElementById("qa-input"), title = input.value.trim();
  if (!title || S.qaBusy) return;
  S.qaBusy = true;
  try {
    const t = await api("POST", "/tasks", { title });
    input.value = ""; S.fresh = "t" + t.id; buzz(); await refresh();
  } catch (err) { toast(err.message); }
  finally { S.qaBusy = false; }
});
document.getElementById("app").addEventListener("change", e => {
  if (e.target.id === "n-hour") saveMe({ task_reminder_hour: Number(e.target.value) }, `Elke dag om ${e.target.options[e.target.selectedIndex].text}`);
  else if (e.target.id === "n-svc") saveMe({ notify_service: e.target.value || null }, e.target.value ? "Meldingen gaan naar " + prettySvc(e.target.value) : "Meldingen uit");
});
async function saveMe(patch, msg) {
  try {
    await api("PUT", "/me", patch);
    Object.assign(user(S.me), patch); buzz(); toast(msg);
    if (S.tab === "settings") render();
  } catch (err) { toast(err.message); }
}
const prettySvc = n => cap(n.replace(/^mobile_app_/, "").replace(/_/g, " "));
// Bijwerken als je terugkomt in de app (bijv. huisgenoot heeft iets toegevoegd).
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.me) refresh().catch(() => {}); });
// Op Taken en Boodschappen elke 20 seconden bijwerken, zodat je ziet wat je huisgenoot net toevoegde of afvinkte.
setInterval(() => {
  if (!document.hidden && S.me && (S.tab === "groceries" || S.tab === "tasks") && !document.getElementById("ov")) refresh().catch(() => {});
}, 20000);

boot();
</script>
